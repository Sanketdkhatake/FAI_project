<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#08211d">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SmartStay AI – Hotel Room Management</title>
<meta name="description" content="AI-based hotel room management: smart room allocation, digital check-in, IoT energy control, housekeeping prediction and predictive maintenance.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
try{var u=JSON.parse(localStorage.getItem('smartstay.ui.v2')||'null');if(u&&u.theme)document.documentElement.setAttribute('data-theme',u.theme)}catch(e){}
</script>
<style>
:root{
  --bg:#f4f6f3;--surface:#ffffff;--surface2:#f8f9f6;--ink:#10201c;--muted:#55655f;--line:#e1e7e2;
  --brand:#0f5a50;--brand-ink:#ffffff;--brand-soft:#dcefea;--gold:#b0593f;--gold2:#ecb097;--gold-soft:#fbece4;
  --ok:#1b8f5a;--ok-soft:#d9f2e5;--occ:#b0700c;--occ-soft:#fdebc8;--clean:#7a4fc2;--clean-soft:#ebe2fa;--bad:#c13a2f;--bad-soft:#fbe2df;--info:#2f64c4;--info-soft:#dde8fa;
  --lamp:#f2a93b;--navy:#08211d;--navy2:#123a34;--side-ink:#c3d6cf;
  --shadow:0 1px 2px rgba(10,40,34,.05),0 12px 32px rgba(10,40,34,.09);--shadow-lg:0 24px 60px rgba(4,24,20,.3);
  --font-display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --font-body:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#06130f;--surface:#0e211c;--surface2:#132a24;--ink:#eef5f2;--muted:#9bb3aa;--line:#1f3a33;
  --brand:#ecb097;--brand-ink:#3a1608;--brand-soft:#33211a;--gold:#ecb097;--gold2:#f3c9b5;--gold-soft:#3a2219;
  --ok:#47c98a;--ok-soft:#133526;--occ:#f0b04a;--occ-soft:#3b2d12;--clean:#a98af0;--clean-soft:#2a2046;--bad:#f27a6e;--bad-soft:#3d1d1a;--info:#7aa5f2;--info-soft:#172a4a;
  --lamp:#f6b650;--navy:#04100c;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{
  --bg:#06130f;--surface:#0e211c;--surface2:#132a24;--ink:#eef5f2;--muted:#9bb3aa;--line:#1f3a33;
  --brand:#ecb097;--brand-ink:#3a1608;--brand-soft:#33211a;--gold:#ecb097;--gold2:#f3c9b5;--gold-soft:#3a2219;
  --ok:#47c98a;--ok-soft:#133526;--occ:#f0b04a;--occ-soft:#3b2d12;--clean:#a98af0;--clean-soft:#2a2046;--bad:#f27a6e;--bad-soft:#3d1d1a;--info:#7aa5f2;--info-soft:#172a4a;
  --lamp:#f6b650;--navy:#04100c;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.35)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px);-webkit-text-size-adjust:100%;scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--font-body);min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.15}
h1,h2.display{font-family:var(--font-display);font-weight:600;letter-spacing:-.005em}
h2{font-size:clamp(21px,2.6vw,26px);font-weight:700}
h2.display{font-size:clamp(34px,4.6vw,54px);line-height:1.04}
h3{font-size:17px;font-weight:700}
p{margin:0}
a{color:var(--brand)}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--gold2);outline-offset:2px;border-radius:8px}
.muted{color:var(--muted)}.small{font-size:13px}.right{text-align:right}.nowrap{white-space:nowrap}.center{text-align:center}
.ico{flex:none;vertical-align:-4px}
.wrap{max-width:1240px;margin:0 auto;padding:0 clamp(16px,4vw,32px)}
.pad{padding-top:clamp(22px,4vw,40px);padding-bottom:64px}
/* ---------- staff shell ---------- */
.app.staff{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.side{background:var(--navy);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px;gap:4px;overflow:auto}
.brand{display:flex;gap:12px;align-items:center;padding:0 8px 20px;color:#fff}
.brand .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#b0593f,#f3c9b5);display:grid;place-items:center;color:#3a1608}
.brand b{font:700 24px var(--font-display);letter-spacing:.01em;line-height:1}.brand small{display:block;color:#7f93ab;font-size:12px;margin-top:2px}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:12px;background:none;color:var(--side-ink);text-align:left;font-weight:500;min-height:44px}
.nav-btn:hover{background:rgba(255,255,255,.07)}
.nav-btn[aria-current="page"]{background:rgba(236,176,151,.16);color:#f8d4c3;font-weight:700}
.side .sp{flex:1}.side-foot{border-top:1px solid rgba(255,255,255,.1);padding-top:12px;display:grid;gap:4px}
.content{min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:12px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h2{font-size:21px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .mlogo{display:none}
.app.staff main{padding:26px 28px 56px;max-width:1320px;margin:0 auto;width:100%}
.iconbtn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:44px;height:44px;padding:0 12px;border:1px solid var(--line);background:var(--surface);border-radius:12px}
.iconbtn:hover{border-color:var(--gold)}
.badge{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;border-radius:999px;min-width:19px;height:19px;display:grid;place-items:center;padding:0 5px}
.live{display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:600;color:var(--muted);padding:0 4px}
.live i{width:9px;height:9px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
.live.off i{background:var(--muted);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(27,143,90,.5)}70%,100%{box-shadow:0 0 0 8px transparent}}
.bnav{display:none}
/* ---------- guest shell ---------- */
.gtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(8,33,29,.94);backdrop-filter:blur(12px);color:#ecf5f1;border-bottom:1px solid rgba(255,255,255,.08)}
.gtop .in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px clamp(16px,4vw,32px)}
.gbrand{display:flex;gap:10px;align-items:center;border:0;background:none;color:#fff;font:700 27px var(--font-display);letter-spacing:.01em;padding:0}
.gbrand .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#b0593f,#f3c9b5);display:grid;place-items:center;color:#3a1608}
.glinks{display:flex;gap:2px;margin-left:22px;flex:1}
.glinks button{white-space:nowrap;border:0;background:none;color:#c3d6cf;padding:0 14px;min-height:44px;border-radius:10px;font-weight:600}
.glinks button:hover{color:#fff;background:rgba(255,255,255,.07)}.glinks button[aria-current="page"]{color:#f8d4c3}
.gtop .iconbtn{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.16);color:#ecf5f1}
.gtop .sp{flex:1}.gtop .btn,.gtop .iconbtn{white-space:nowrap;flex:none}
.gfoot{background:var(--navy);color:#a9c2b8;padding:56px 0 calc(40px + 70px)}
.gfoot .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px}
.gfoot h4{color:#fff;font:700 15px var(--font-body);margin-bottom:12px}
.gfoot a,.gfoot button.lnk{display:block;color:#a9c2b8;text-decoration:none;border:0;background:none;padding:4px 0;text-align:left;font-size:14px}
.gfoot a:hover,.gfoot button.lnk:hover{color:#f8d4c3}
.gfoot .legal{margin-top:36px;padding-top:20px;border-top:1px solid rgba(255,255,255,.1);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
@media (max-width:999px){
  .app.staff{display:block}.side{display:none}
  .top{padding:10px 14px}.top .mlogo{display:grid;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#b0593f,#f3c9b5);place-items:center;color:#3a1608}
  .top h2{font-size:19px}.live span{display:none}
  .app.staff main{padding:18px 14px calc(96px + env(safe-area-inset-bottom,0px))}
  .glinks{display:none}.gtop .sp{display:block}
  .gfoot .cols{grid-template-columns:1fr 1fr}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;box-shadow:0 -8px 24px rgba(0,0,0,.06)}
  .bnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 2px;min-height:52px;border-radius:12px}
  .bnav button[aria-current="page"]{color:var(--brand)}.bnav button[aria-current="page"] .ico{stroke-width:2.4}
}
@media (min-width:1000px){.gfoot{padding-bottom:40px}}
@media (max-width:560px){.gfoot .cols{grid-template-columns:1fr}.gbrand{font-size:22px}.gtop .in{gap:8px}.gtop .iconbtn .small{display:none}.gtop .iconbtn{padding:0;min-width:42px}.top .live{display:none}.top{gap:8px}.chart text{font-size:15px}.hero .row .btn{flex:1 1 100%}}
/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}.card h3{margin-bottom:12px}
.page-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.page-head p{color:var(--muted);margin-top:4px;max-width:62ch}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.row.end{justify-content:flex-end;margin-top:18px}.row.between{justify-content:space-between}
.stack{display:grid;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);font-weight:700;background:var(--surface2);transition:transform .08s,filter .15s,border-color .15s;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--gold)}.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}.btn.primary:hover{filter:brightness(1.12)}
.btn.gold{background:linear-gradient(135deg,#c9775a,#f3c9b5);color:#3a1608;border-color:#c9775a}.btn.gold:hover{filter:brightness(1.06)}
.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{background:transparent}.btn.light{background:transparent;color:#ecf5f1;border-color:rgba(255,255,255,.3)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}.btn.lg{min-height:54px;padding:0 28px;font-size:16px;border-radius:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.occ{background:var(--occ-soft);color:var(--occ)}.chip.warn{background:var(--clean-soft);color:var(--clean)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.info{background:var(--info-soft);color:var(--info)}.chip.brand{background:var(--gold-soft);color:var(--gold)}.chip.neutral{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.kpi{display:flex;gap:14px;align-items:center;padding:16px 18px}
.kpi .bub{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--brand-soft);color:var(--brand)}
.kpi .v{font:700 29px/1 var(--font-display)}.kpi .l{color:var(--muted);font-size:13px;margin-top:4px}
.kpi.lamp .bub{background:var(--occ-soft);color:var(--occ)}.kpi.bad .bub{background:var(--bad-soft);color:var(--bad)}.kpi.ok .bub{background:var(--ok-soft);color:var(--ok)}.kpi.clean .bub{background:var(--clean-soft);color:var(--clean)}
.field{display:grid;gap:6px;align-content:start;min-width:0}.field label,.lbl{font-weight:600;font-size:13px}
input[type=text],input[type=tel],input[type=email],input[type=date],input[type=search],input[type=password],input[type=number],select,textarea{width:100%;min-width:0;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);font-size:16px}
textarea{resize:vertical;min-height:84px}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px var(--gold-soft)}
[aria-invalid="true"]{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.ferr{color:var(--bad);font-size:13px;font-weight:600;margin-top:-2px}
input[type=range]{width:100%;accent-color:var(--gold)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.check{display:flex;gap:10px;align-items:center;min-height:44px;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--gold)}
.err{background:var(--bad-soft);color:var(--bad);padding:10px 12px;border-radius:10px;font-weight:600;font-size:14px}
.note{background:var(--gold-soft);color:var(--ink);padding:10px 12px;border-radius:10px;font-size:14px}
.note.ok{background:var(--ok-soft)}.note.info{background:var(--info-soft)}
.banner{background:var(--occ-soft);color:var(--occ);padding:8px 14px;font-size:13px;font-weight:600;text-align:center}
.item{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0;padding-bottom:0}.item:first-child{padding-top:0}
.item .main{min-width:0;flex:1 1 220px}.item b{font-weight:700}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1px solid var(--line);background:var(--surface);padding:0 14px;min-height:40px;border-radius:999px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{height:9px;background:var(--surface2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}.bar.hot i{background:var(--occ)}.bar.bad i{background:var(--bad)}
.statusbar{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px}.statusbar i{display:block;min-width:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-top:10px}
.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart{width:100%;height:auto;display:block;overflow:visible}.chart text{fill:var(--muted);font:11px var(--font-body)}
.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}
th{font-size:12px;text-align:left;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}td{padding:10px;border-bottom:1px solid var(--line);font-size:14px}
tr:last-child td{border-bottom:0}
.calt{min-width:760px;border-collapse:separate;border-spacing:0}.calt th,.calt td{border-bottom:1px solid var(--line);text-align:center;font-size:12px;padding:0}.calt th{padding:8px 4px;white-space:nowrap;color:var(--muted);font-weight:600}.calt td.cal{height:32px;min-width:44px;border-left:1px solid var(--line)}.calt td.in{background:var(--lamp);cursor:pointer}.calt td.bk{background:var(--info);opacity:.85;cursor:pointer}.calt td.mt{background:repeating-linear-gradient(45deg,var(--bad-soft),var(--bad-soft) 4px,transparent 4px,transparent 8px)}.calt th:first-child,.calt td:first-child{position:sticky;left:0;background:var(--surface);z-index:1;font-weight:700;text-align:left;padding:0 12px;min-width:70px;font-size:13px;color:var(--ink)}
.split{display:grid;grid-template-columns:minmax(300px,400px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface2)}
.stepper button{width:44px;height:44px;border:0;background:none;font-size:20px;font-weight:700}
.stepper button:hover{background:var(--gold-soft)}.stepper output{min-width:64px;text-align:center;font:700 22px var(--font-display)}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg2 button{border:0;background:var(--surface2);padding:0 16px;min-height:44px;font-weight:600}
.seg2 button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.switch{display:inline-flex;align-items:center;gap:10px;font-weight:600;min-height:44px;cursor:pointer;position:relative}
.switch input{position:absolute;opacity:0;width:46px;height:26px;margin:0}
.switch span{width:46px;height:26px;border-radius:99px;background:var(--line);position:relative;transition:.2s;flex:none}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked+span{background:var(--ok)}.switch input:checked+span::after{left:23px}
.switch input:focus-visible+span{outline:3px solid var(--gold2);outline-offset:2px}
.progress{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
.progress div{flex:1 1 140px;display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:14px}
.progress b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);font-size:13px}
.progress .on{color:var(--ink);border-color:var(--gold)}.progress .on b{background:var(--gold2);border-color:var(--gold2);color:#3a1608}.progress .done b{background:var(--ok);color:#fff;border-color:var(--ok)}
/* ---------- landing ---------- */
.hero{position:relative;background:radial-gradient(1000px 500px at 85% 0%,rgba(236,176,151,.2),transparent 60%),linear-gradient(180deg,#08211d 0%,#0f3a33 100%);color:#ecf5f1;overflow:hidden}
.hero .skyline{position:absolute;left:0;right:0;bottom:0;width:100%;height:46%;opacity:.5;pointer-events:none}
.hero .in{position:relative;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:clamp(24px,5vw,64px);align-items:center;padding-top:clamp(44px,8vw,92px);padding-bottom:clamp(96px,12vw,150px)}
.hero h1{font-size:clamp(44px,7.4vw,90px);line-height:.98;color:#fff;font-weight:600}
.hero h1 em{font-style:italic;color:var(--gold2)}
.hero p.lead{color:#b6cdc4;font-size:clamp(16px,1.6vw,19px);max-width:48ch;margin:22px 0 30px;line-height:1.6}
.hero .trust{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:30px;color:#9fb0c7;font-size:14px}
.hero .trust span{display:inline-flex;gap:8px;align-items:center}.hero .trust .ico{color:var(--gold2)}
.facade{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:18px 18px 0;backdrop-filter:blur(6px);box-shadow:var(--shadow-lg)}
.facade h3{color:#fff;font:600 22px var(--font-display);margin:0 0 2px}.facade .sub{font-size:13px;color:#8fb0a5;margin-bottom:14px}

/* pricing */
function forecast(d){
  const dow=new Date(d+'T00:00:00').getDay();
  const same=S.history.filter(h=>new Date(h.date+'T00:00:00').getDay()===dow).map(h=>h.occ);
  const base=avg(same),known=occOn(d)*100,ahead=Math.max(0,Math.round((new Date(d)-new Date(today()))/864e5));
  const w=clamp(.85-ahead*.1,.25,.85);
  return Math.round(clamp(Math.max(known,known*w+base*(1-w)),0,100));
}
function occOn(d){return S.bookings.filter(b=>(b.status==='booked'||b.status==='checked-in')&&b.checkIn<=d&&b.checkOut>d).length/S.rooms.length}
function priceMult(d){const f=forecast(d);return f<45?.9:f<70?1:f<85?1.1:1.2}
function priceFor(r,d){return Math.round(r.price*(S.settings.dynamic?priceMult(d):1))}
function quote(r,ci,co,o){
  o=o||{};const n=nightsBetween(ci,co),g=o.guests||1;let base=0;
  for(let i=0;i<n;i++)base+=priceFor(r,addDays(ci,i));
  const add=[];let addons=0;
  if(o.breakfast){const v=450*g*n;add.push(['Breakfast for '+g+(g>1?' guests':' guest'),v]);addons+=v}
  if(o.pickup){add.push(['Airport pickup',1200]);addons+=1200}
  const pr=o.promo&&PROMOS[o.promo];let disc=0;
  if(pr&&(!pr.minNights||n>=pr.minNights))disc=Math.round(base*pr.pct/100);
  const sub=base+addons-disc,gst=Math.round(sub*S.settings.gst/100);
  return{n,base,add,addons,disc,promo:disc?o.promo:null,sub,gst,gstPct:S.settings.gst,total:sub+gst};
}

/* data validation (guards against corrupted or hand-edited storage) */
function validData(d){
  try{
    if(!d||d.v!==2||!Array.isArray(d.rooms)||d.rooms.length!==24||!Array.isArray(d.bookings)||!Array.isArray(d.tasks)||!Array.isArray(d.tickets)||!Array.isArray(d.alerts)||!Array.isArray(d.history)||!Array.isArray(d.reviews))return false;
    if(!d.settings||!d.energy||!d.stats||!Array.isArray(d.energy.series))return false;
    if(!d.rooms.every(r=>r&&typeof r.id==='number'&&STATUS[r.status]&&r.ac&&Array.isArray(r.pw)))return false;
    if(!d.bookings.every(b=>b&&typeof b.id==='string'&&d.rooms.some(r=>r.id===b.roomId)&&validDate(b.checkIn)&&validDate(b.checkOut)&&b.quote&&Array.isArray(b.extras)))return false;
    return true;
  }catch(e){return false}
}

function isFree(r,ci,co,ignore){
  if(r.status==='maintenance'&&ci<=addDays(today(),1))return false;
  return !S.bookings.some(b=>b.roomId===r.id&&(b.status==='booked'||b.status==='checked-in')&&b.id!==ignore&&b.checkIn<co&&b.checkOut>ci);
}
function occFrac(f){return S.rooms.filter(r=>r.floor===f&&r.status==='occupied').length/6}
function guestList(){
  const m={};S.bookings.forEach(b=>{const g=m[b.phone]||(m[b.phone]={phone:b.phone,name:b.name,email:b.email,bookings:[],spend:0,pref:b.pref});
    g.bookings.push(b);if(b.status==='checked-in'||b.status==='checked-out')g.spend+=billTotal(b)});
  return Object.values(m).map(g=>{g.visits=g.bookings.filter(b=>b.status==='checked-in'||b.status==='checked-out').length;g.points=Math.floor(g.spend/100);
    g.tier=g.spend>=60000?'Platinum':g.spend>=30000?'Gold':g.spend>=10000?'Silver':'Member';return g});
}
function profileOf(email,phone){
  const past=S.bookings.filter(b=>(email&&b.email===email)||(phone&&b.phone===phone));if(!past.length)return null;
  const cnt={};past.forEach(b=>{const r=room(b.roomId);if(r)cnt[r.type]=(cnt[r.type]||0)+1});
  const type=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];return type?{type,n:past.length}:null;
}
const avgRating=()=>S.reviews.length?avg(S.reviews.map(r=>r.stars)):0;
/* AI: smart room allocation (weighted preference scoring) */
function recommend(p,ci,co){
  const prof=profileOf(p.email,p.phone),out=[];
  for(const r of S.rooms){
    if(r.cap<p.guests||!isFree(r,ci,co))continue;
    const parts=[],add=(label,pts,max)=>parts.push({label,pts,max});
    add('Right size for '+p.guests+' guest'+(p.guests>1?'s':''),Math.max(0,10-(r.cap-p.guests)*2.5),10);
    if(p.type&&p.type!=='Any')add(r.type+' room',r.type===p.type?30:0,30);
    if(p.view&&p.view!=='Any')add(r.view+' view',r.view===p.view?15:0,15);
    if(p.floor==='High')add('High floor',Math.min(12,r.floor*3),12);
    if(p.floor==='Low')add('Low floor',Math.min(12,(5-r.floor)*3),12);
    if(p.quiet)add('Quiet end of corridor',r.quiet?15:0,15);
    if(p.budget>0)add('Within budget',priceFor(r,ci)<=p.budget?20:0,20);
    if(prof)add('Matches your past stays',r.type===prof.type?8:0,8);
    if(ci===today())add('Ready for immediate check-in',r.status==='available'?8:0,8);
    add('Placed with occupied rooms to save energy',occFrac(r.floor)*6,6);
    const pts=sum(parts.map(x=>x.pts)),max=sum(parts.map(x=>x.max));
    out.push({r,match:clamp(Math.round(pts/max*100),35,99),reasons:parts.filter(x=>x.pts>=x.max*.6&&x.pts>0).map(x=>x.label),returning:!!prof});
  }
  return out.sort((a,b)=>b.match-a.match||a.r.price-b.r.price);
}

function checkInBooking(id,quiet){

/* =====================  IoT SIMULATION + AI CONTROL  ===================== */
function tick(silent){
  const dt=5;let tot=0,base=0;
  for(const r of S.rooms){
    if(r.status==='occupied'){
      if(r.presence){if(Math.random()<.1)r.presence=false}else if(Math.random()<.2)r.presence=true;
      if(r.presence){r.vacantMin=0;r.usage+=1.3}else r.vacantMin+=dt;
    }else{r.presence=false;r.vacantMin=0}
    if(S.settings.auto){
      if(r.status==='occupied'){
        if(!r.presence&&r.vacantMin>=S.settings.eco){
          if(r.ac.mode==='cool'){r.ac.mode='eco';if(!silent)note('info','Room '+r.number+' empty for '+r.vacantMin+' min. AC set to eco, lights off')}
          r.lights=false;
        }else if(r.presence){
          if(r.ac.mode==='eco'){r.ac.mode='cool';if(!silent)note('ok','Guest is back in Room '+r.number+'. Comfort restored')}
          r.lights=true;
        }
      }else{r.ac.mode='off';r.lights=false}
    }
    const eff=r.ac.mode==='cool'?r.ac.set:r.ac.mode==='eco'?r.ac.set+3:null;
    let target=eff!==null?eff:29;if(r.fault==='ac')target=Math.max(target,34);
    const rate=(eff!==null&&r.fault!=='ac')?.9:.4;
    r.temp+=Math.sign(target-r.temp)*Math.min(Math.abs(target-r.temp),rate)+(Math.random()-.5)*.1;
    let kw=r.lights?.06:0;
    if(eff!==null)kw+=(r.ac.mode==='eco'?.28:.5)+Math.min(.7,Math.max(0,r.temp-eff)*.1)+(Math.random()-.5)*.06;
    if(r.fault==='ac')kw+=1.6+Math.random()*.5;
    if(r.fault==='surge'&&Math.random()<.6)kw+=1.8+Math.random()*1.2;
    r.kw=+kw.toFixed(2);
    /* anomaly detection: compare actual power with the power expected for the room's current settings */
    const sig=r.status+r.ac.mode+r.ac.set;if(sig!==r.sig){r.sig=sig;r.hot=0;r.settle=0}else r.settle=(r.settle||0)+1;
    r.pw.push(r.kw);if(r.pw.length>14)r.pw.shift();
    const exp=(r.lights?.06:0)+(eff!==null?(r.ac.mode==='eco'?.28:.5)+Math.min(.7,Math.max(0,r.temp-eff)*.1):0),resid=r.kw-exp;
    if(!silent){
      if(resid>.9)raiseTicket(r,'Abnormal power draw','Drawing '+r.kw.toFixed(2)+' kW, which is '+resid.toFixed(2)+' kW above the '+exp.toFixed(2)+' kW expected for its current settings.','high');
      if(eff!==null&&r.settle>=6&&r.temp-eff>3.8){r.hot++;if(r.hot>=3)raiseTicket(r,'AC not cooling','Room is '+r.temp.toFixed(1)+'°C against a set point of '+eff+'°C for '+r.hot+' readings.','high')}else if(r.temp-eff<=3.8)r.hot=0;
    }
    tot+=r.kw;base+=r.status==='occupied'?.62:0;
  }
  S.energy.kwh+=tot*dt/60;S.energy.saved+=Math.max(0,base-tot)*dt/60;S.energy.load=tot;
  S.energy.series.push({a:+tot.toFixed(2),b:+base.toFixed(2)});if(S.energy.series.length>36)S.energy.series.shift();
  predictHK(silent);
  if(!silent){save();refreshLive()}
}

function countUp(el){
  const raw=el.textContent.trim(),m=raw.match(/^(\d+(?:\.\d+)?)(.*)$/);if(!m)return;
  const end=parseFloat(m[1]),dec=(m[1].split('.')[1]||'').length,suffix=m[2];if(!(end>0))return;
  const t0=performance.now(),dur=900;
  (function f(t){const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=(end*e).toFixed(dec)+suffix;if(k<1)requestAnimationFrame(f);else el.textContent=raw})(t0);
}

function setupReveal(){
  if(REVEAL_DONE||UI.view!=='home'||UI.role!=='guest')return;
  if(!('IntersectionObserver' in window)||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){REVEAL_DONE=true;return}
  REVEAL_DONE=true;
  const els=document.querySelectorAll('.rtc,.feat,.steps div,.offer,.quote,.faq details,.stats>div,.sec .head');
  const io=new IntersectionObserver(es=>es.forEach(en=>{
    if(!en.isIntersecting)return;const el=en.target;io.unobserve(el);el.classList.add('in');
    if(el.matches('.stats>div')){const b=el.querySelector('b');if(b)countUp(b)}
    setTimeout(()=>el.classList.remove('rv','in'),1100);
  }),{threshold:.15,rootMargin:'0px 0px -40px 0px'});
  els.forEach(el=>{const sib=[...el.parentElement.children].indexOf(el);el.style.setProperty('--d',(Math.min(sib,5)*.09)+'s');el.classList.add('rv');io.observe(el)});
}

function closeModal(){OPENROOM=null;$('#modalRoot').hidden=true;document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function toast(msg,kind){const el=document.createElement('div');el.className='toast '+(kind||'');el.textContent=msg;const c=$('#toasts');c.appendChild(el);while(c.children.length>3)c.firstChild.remove();setTimeout(()=>el.remove(),3800)}
function ask(title,msg,yes,label,danger){CB=yes;openModal(`<h3>${title}</h3><p class="muted" style="margin-top:6px">${msg}</p><div class="row end"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn ${danger?'danger':'primary'}" onclick="const f=CB;closeModal();f&&f()">${label||'Confirm'}</button></div>`)}
function openMore(){
  const items=NAV.staff.filter(n=>BOTTOM.staff.indexOf(n[0])<0);

/* staff auth with lockout */
let PINFAIL=0,PINLOCK=0;
function openRole(){
  if(UI.role==='staff'){go('dashboard');return}
  openModal(`<h3>Staff sign in</h3><p class="muted small" style="margin-top:4px">For hotel staff only. Guests do not need to sign in.</p>
   <form class="stack" style="margin-top:14px" onsubmit="staffLogin(event)" novalidate><div class="field"><label for="pin">Staff PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="Enter PIN"><span class="muted small">Demo PIN: ${esc(S.settings.pin)}</span></div>
   <div id="pinErr"></div><button class="btn primary lg" type="submit">${ico('key')} Open staff console</button></form>`);
  setTimeout(()=>{const p=$('#pin');if(p)p.focus()},50);
}
function staffLogin(e){
  e.preventDefault();const box=$('#pinErr'),v=$('#pin').value;
  if(Date.now()<PINLOCK){box.innerHTML=`<div class="err">Too many attempts. Try again in ${Math.ceil((PINLOCK-Date.now())/1000)} seconds.</div>`;return}
  if(!v){box.innerHTML='<div class="err">Enter the staff PIN.</div>';return}
  if(v===S.settings.pin){PINFAIL=0;UI.role='staff';UI.view='dashboard';uiSave();closeModal();render();window.scrollTo(0,0);toast('Welcome to the staff console','ok');return}
  PINFAIL++;$('#pin').value='';
  if(PINFAIL>=3){PINLOCK=Date.now()+30000;PINFAIL=0;box.innerHTML='<div class="err">Too many wrong PINs. Locked for 30 seconds.</div>'}
  else box.innerHTML=`<div class="err">Incorrect PIN. ${3-PINFAIL} attempt${3-PINFAIL>1?'s':''} left.</div>`;
}
function signOutStaff(){UI.role='guest';UI.view='home';uiSave();closeModal();render();window.scrollTo(0,0)}
function openBell(){
  UI.ack=Date.now();uiSave();const list=S.alerts.filter(a=>a.type==='danger'||a.type==='warn').slice(0,15);
  openModal(`<h3>Alerts</h3>${list.length?`<div style="margin-top:8px">${list.map(a=>`<div class="item"><div class="main">${chip(a.type==='danger'?'bad':'warn',a.type==='danger'?'Urgent':'Notice')} <span class="small muted">${ago(a.t)}</span><div>${esc(a.msg)}</div></div></div>`).join('')}</div>`:'<div class="empty">No alerts. Everything is running normally.</div>'}`);

}

/* export / copy helpers with graceful fallback */
function exportText(name,text){
  openModal(`<h3>${esc(name)}</h3><p class="muted small" style="margin:4px 0 10px">Download the file, or copy the text if your browser blocks downloads.</p><textarea readonly rows="10" id="cpTxt" aria-label="File contents">${esc(text)}</textarea>
   <div class="row end"><button class="btn" onclick="copyTxt()">Copy text</button><button class="btn primary" onclick="downloadTxt('${esc(name)}')">${ico('download')} Download</button></div>`,true);
}
function downloadTxt(name){
  try{const blob=new Blob([$('#cpTxt').value],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);toast('Download started','ok')}
  catch(e){toast('Download is blocked here. Use Copy text instead.','bad')}
}
function copyTxt(){
  const t=$('#cpTxt');if(!t)return;
  const fallback=()=>{try{t.select();document.execCommand('copy');toast('Copied','ok')}catch(e){toast('Select the text and copy it manually','bad')}};
  try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t.value).then(()=>toast('Copied','ok'),fallback);else fallback()}catch(e){fallback()}
}
function csvCell(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function exportBookings(){
  const rows=[['Booking ID','Guest','Phone','Email','Room','Check-in','Check-out','Guests','Status','Total (INR)']];
  S.bookings.forEach(b=>rows.push([b.id,b.name,b.phone,b.email,b.roomId,b.checkIn,b.checkOut,b.guests,b.status,billTotal(b)]));
  exportText('smartstay-bookings.csv',rows.map(r=>r.map(csvCell).join(',')).join('\n'));
}
function exportBackup(){exportText('smartstay-backup.json',JSON.stringify(S))}
function restoreDlg(){
  openModal(`<h3>Restore from backup</h3><p class="muted small" style="margin:4px 0 10px">Paste the contents of a SmartStay backup file. This replaces all current data.</p><textarea id="rsTxt" rows="8" aria-label="Backup JSON" placeholder='{"v":2,...}'></textarea><div id="rsErr" style="margin-top:10px"></div>
   <div class="row end"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="restoreNow()">Restore</button></div>`,true);
}
function restoreNow(){
  const txt=$('#rsTxt').value.trim(),box=$('#rsErr');if(!txt){box.innerHTML='<div class="err">Paste the backup text first.</div>';return}
  let d;try{d=JSON.parse(txt)}catch(e){box.innerHTML='<div class="err">That is not valid JSON. Copy the whole backup text and try again.</div>';return}
  if(!validData(d)){box.innerHTML='<div class="err">This backup is incomplete or from a different version, so it was not restored. Your current data is unchanged.</div>';return}
  S=d;UI.session=null;save();uiSave();startSim();closeModal();render();toast('Backup restored','ok');
}

function keyArt(id){
  let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))>>>0;const n=25,c=8;let s='';const r=()=>{h=(h*1664525+1013904223)>>>0;return h/4294967296};
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){if((x<8&&y<8)||(x>16&&y<8)||(x<8&&y>16))continue;if(r()>.52)s+=`<rect x="${x*c}" y="${y*c}" width="${c}" height="${c}" fill="#08211d"/>`}
  const f=(x,y)=>`<rect x="${x*c}" y="${y*c}" width="${7*c}" height="${7*c}" fill="#08211d"/><rect x="${(x+1)*c}" y="${(y+1)*c}" width="${5*c}" height="${5*c}" fill="#fff"/><rect x="${(x+2)*c}" y="${(y+2)*c}" width="${3*c}" height="${3*c}" fill="#08211d"/>`;
  return `<svg viewBox="0 0 ${n*c} ${n*c}" role="img" aria-label="Digital room key code">${s}${f(0,0)}${f(18,0)}${f(0,18)}</svg>`;
}

/* =====================  CHARTS  ===================== */
function barChart(items,o){
  o=o||{};const W=520,H=o.h||190,L=36,R=8,T=14,B=28,n=items.length||1;
  const max=o.max||Math.max(1,...items.map(i=>Math.max(i.value,i.value2||0)));
  const iw=(W-L-R)/n,bw=Math.min(44,iw*.55),hh=v=>(H-T-B)*v/max;let g='';
  [0,.5,1].forEach(f=>{const y=T+(H-T-B)*(1-f);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+4}" text-anchor="end">${Math.round(max*f)}${o.unit||''}</text>`});
  items.forEach((it,i)=>{const x=L+iw*i+(iw-bw)/2;
    if(it.value2!=null)g+=`<rect x="${x}" y="${H-B-hh(it.value2)}" width="${bw}" height="${Math.max(0,hh(it.value2))}" rx="5" fill="var(--gold2)" opacity=".6"/>`;
    g+=`<rect x="${x}" y="${H-B-hh(it.value)}" width="${bw}" height="${Math.max(0,hh(it.value))}" rx="5" fill="var(--brand)"/><text x="${x+bw/2}" y="${H-9}" text-anchor="middle">${it.label}</text>`;
    if(o.labels)g+=`<text x="${x+bw/2}" y="${H-B-hh(Math.max(it.value,it.value2||0))-5}" text-anchor="middle" style="fill:var(--ink);font-weight:700">${o.fmt?o.fmt(Math.max(it.value,it.value2||0)):Math.round(Math.max(it.value,it.value2||0))+(o.unit||'')}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Chart')}">${g}</svg>`;
}
function lineChart(series,o){
  o=o||{};const W=520,H=200,L=38,R=10,T=12,B=20,n=Math.max(2,series[0].data.length);
  const max=Math.max(1,...series.flatMap(s=>s.data))*1.15,X=i=>L+(W-L-R)*i/(n-1),Y=v=>H-B-(H-T-B)*v/max;let g='';
  [0,.5,1].forEach(f=>{const y=T+(H-T-B)*(1-f);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+4}" text-anchor="end">${(max*f).toFixed(0)}</text>`});
  series.forEach((s,k)=>{if(s.data.length<2)return;const d=s.data.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
    if(k===0)g+=`<path d="${d} L${X(s.data.length-1)} ${H-B} L${X(0)} ${H-B}Z" fill="${s.color}" opacity=".13"/>`;
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.4" stroke-linejoin="round" ${s.dash?'stroke-dasharray="6 5"':''}/>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Chart')}">${g}</svg>`;
}

function openRoom(id){

   ${UI.role==='staff'&&BK.ci===today()?`<label class="check"><input type="checkbox" onchange="REV.now=this.checked"> Check the guest in right away</label>`:''}
   <label class="check"><input type="checkbox" id="terms" onchange="REV.terms=this.checked"> I agree to the booking terms. Free cancellation before check-in.</label><div id="revErr"></div>
   <button class="btn gold lg block" onclick="confirmBooking()">Confirm booking</button></div>`);
  drawQuote();if(REV.promo)applyPromo(true);
}
function drawQuote(){
  const r=room(REV.rid),q=quote(r,BK.ci,BK.co,{guests:BK.guests,breakfast:REV.breakfast,pickup:REV.pickup,promo:REV.promo}),L=(a,v,c)=>`<div class="qline ${c||''}"><span>${a}</span><span>${v}</span></div>`;
  $('#quoteBox').innerHTML=L(q.n+' night'+(q.n>1?'s':'')+' · '+inr(q.base/q.n)+' avg',inr(q.base))+q.add.map(a=>L(esc(a[0]),inr(a[1]))).join('')+(q.disc?L('Promo '+esc(q.promo),'−'+inr(q.disc)):'')+L('GST '+q.gstPct+'%',inr(q.gst))+L('Total','<b>'+inr(q.total)+'</b>','tot');
}
function applyPromo(silent){
  const code=($('#pc').value||'').trim().toUpperCase(),box=$('#pcMsg');
  if(!code){REV.promo='';box.innerHTML='';drawQuote();return}
  const p=PROMOS[code],n=nightsBetween(BK.ci,BK.co);
  if(!p){REV.promo='';box.innerHTML='<div class="ferr">That code is not valid. Try WELCOME10 or STAY3.</div>'}
  else if(p.minNights&&n<p.minNights){REV.promo='';box.innerHTML=`<div class="ferr">${code} needs a stay of ${p.minNights} nights or more.</div>`}
  else{REV.promo=code;box.innerHTML=`<div class="small" style="color:var(--ok);font-weight:600">${code} applied: ${p.desc}</div>`}
  drawQuote();
}
function confirmBooking(){

  if(!REV.terms)return err('Please accept the booking terms to continue.');
  if(!isFree(r,BK.ci,BK.co))return err('Sorry, this room was just taken. Close this and search again.');
  const b=createBooking(BK,r,{breakfast:REV.breakfast,pickup:REV.pickup,promo:REV.promo,requests:($('#rq').value||'').trim().slice(0,300)});
  const wantNow=REV.now;BK=null;REV=null;BKSTEP=3;if(UI.role==='guest'){UI.session=b.id;uiSave()}
  const doNow=wantNow&&checkInBooking(b.id,true);
  openModal(`<div class="center"><div class="kpi ok" style="justify-content:center;padding:0"><span class="bub" style="width:64px;height:64px;border-radius:50%">${ico('check',32)}</span></div>

   <div class="note small"><b>Room ${r.number}</b> (${r.type}, ${r.view} view)<br>${fdate(b.checkIn)} – ${fdate(b.checkOut)} · ${b.guests} guest${b.guests>1?'s':''}<br>Total ${inr(b.total)} incl. GST · pay at the hotel<br>${doNow?'Checked in and pre-cooled to '+b.pref.temp+'°C.':wantNow?'The room was not ready for immediate check-in, so the booking stays upcoming.':'Your room will be pre-cooled to '+b.pref.temp+'°C on check-in.'}</div>
   <p class="small muted" style="margin-top:10px">Keep your booking ID and mobile number. You need both to manage your stay.</p>
   <div class="row end"><button class="btn" onclick="showBill(booking('${b.id}'))">Receipt</button>${UI.role==='guest'?`<button class="btn primary" onclick="go('stay')">View my stay</button>`:`<button class="btn primary" onclick="go('bookings')">View bookings</button>`}</div>`);
  render();
}

let STAYFAIL=0,STAYLOCK=0;
function findStay(e){
  e.preventDefault();const id=$('#sid').value.trim().toUpperCase(),ph=$('#sph').value.trim(),box=$('#sErr');
  if(Date.now()<STAYLOCK){box.innerHTML='<div class="err">Too many attempts. Please wait a moment and try again.</div>';return}
  if(!id||!ph){box.innerHTML='<div class="err">Enter both your booking ID and mobile number.</div>';return}
  if(!/^\d{10}$/.test(ph)){box.innerHTML='<div class="err">Mobile number must be 10 digits.</div>';return}
  const b=booking(id);
  if(!b||b.phone!==ph){STAYFAIL++;if(STAYFAIL>=5){STAYLOCK=Date.now()+30000;STAYFAIL=0}box.innerHTML='<div class="err">We could not find a booking with that ID and mobile number. Check both and try again.</div>';return}
  STAYFAIL=0;UI.session=id;uiSave();render();
}
function drawStayLive(){
  const b=UI.session&&booking(UI.session);if(!b||b.status!=='checked-in')return;
  const r=room(b.roomId),l=$('#stayLive'),c=$('#stayCtl');
  if(l){const eco=r.ac.mode==='eco';l.innerHTML=`<div class="live-grid"><div><small>Temperature</small><b>${r.temp.toFixed(1)}°C</b></div><div><small>AC</small><b>${r.ac.mode==='off'?'Off':r.ac.mode==='eco'?'Eco':r.ac.set+'°C'}</b></div><div><small>Lights</small><b>${r.lights?'On':'Off'}</b></div></div>
   <p class="note small" style="margin-top:12px">${eco?'You seem to be out. AI switched to eco mode and will restore '+r.ac.set+'°C when you return.':r.presence?'Your room is set to your preferred '+r.ac.set+'°C.':'Room sensors detect nobody inside right now.'}</p>`}
  if(c&&!c.dataset.ready){c.dataset.ready=1;drawStayCtl()}
}
function drawStayCtl(){
  const b=booking(UI.session),c=$('#stayCtl');if(!b||!c)return;const r=room(b.roomId);
  c.innerHTML=`<div class="stack"><div class="row between"><span class="lbl">Temperature</span><div class="stepper"><button aria-label="Lower" onclick="gTemp(-1)">−</button><output>${r.ac.set}°C</output><button aria-label="Raise" onclick="gTemp(1)">+</button></div></div>
   <label class="switch"><input type="checkbox" ${r.ac.mode!=='off'?'checked':''} onchange="gAC(this.checked)"><span></span>Air conditioning</label><label class="switch"><input type="checkbox" ${r.lights?'checked':''} onchange="gLights(this.checked)"><span></span>Lights</label></div>`;

function gTemp(d){const b=booking(UI.session),r=room(b.roomId);r.ac.set=clamp(r.ac.set+d,18,28);b.pref.temp=r.ac.set;if(r.ac.mode==='off')r.ac.mode='cool';save();drawStayCtl();drawStayLive()}

function gLights(on){const b=booking(UI.session),r=room(b.roomId);r.lights=on;save();drawStayLive()}
function guestReq(item){

function sendReport(e,guest){
  e.preventDefault();const t=$('#rpT').value.trim(),r=room($('#rpRoom').value);
  if(t.length<3){$('#rpErr').innerHTML='<div class="err">Describe the problem in a few words.</div>';return}
  if(!r){$('#rpErr').innerHTML='<div class="err">Choose a valid room.</div>';return}
  S.tickets.unshift({id:'T'+S.tid++,roomId:r.id,title:t,detail:guest?'Reported by guest':'Reported by staff',severity:$('#rpS').value,source:guest?'Guest request':'Staff report',status:'open',assignee:'',created:Date.now()});
  r.flag=true;note('warn','Room '+r.number+': '+t);save();closeModal();toast('Report sent. Maintenance will follow up.','ok');if(UI.view==='maintenance')render();
}

/* ---- housekeeping ---- */
VIEWS.housekeeping=()=>{
  const open=S.tasks.filter(t=>t.status!=='done').map(t=>({t,s:taskScore(t)})).sort((a,b)=>b.s-a.s);
  const done=S.tasks.filter(t=>t.status==='done').sort((a,b)=>b.done-a.done).slice(0,4);
  const byFloor={};open.forEach(x=>{const f=room(x.t.roomId).floor;byFloor[f]=(byFloor[f]||0)+x.s});

/* ---- AI assistant ---- */
let CH={msgs:[{who:'bot',text:"Hi, I'm Aria, your AI concierge. I can check availability, recommend a room, change your AC, or send a request to housekeeping.",chips:['Rooms available today','Recommend a room for a family','Extra towels please','Check-out time']}],pending:null},MIC=false;
const SR=typeof window!=='undefined'&&(window.SpeechRecognition||window.webkitSpeechRecognition);
function sessionRoom(){const b=UI.session&&booking(UI.session);return b&&b.status==='checked-in'?room(b.roomId):null}
VIEWS.chat=()=>{
  const sr=sessionRoom();
  return `<div class="page-head"><div><h2 class="display">AI assistant</h2><p>${UI.role==='staff'?'Staff mode: include a room number, like "AC too hot in 304".':sr?'Signed in to Room '+sr.number+'. Ask for anything.':'Ask about rooms and rates. To make requests for your room, open My stay and sign in first.'}</p></div></div>
  <div class="card chat"><div class="msgs" id="chatMsgs" aria-live="polite"></div><div class="chips" id="chatChips"></div>
  <form class="cform" onsubmit="sendChat(event)"><input id="chatIn" type="text" maxlength="200" placeholder="Type your question" aria-label="Message" autocomplete="off"><button class="btn" type="button" onclick="micChat()" aria-label="Speak your question" title="${SR?'Speak your question':'Voice input is not supported in this browser'}">${ico('mic')}</button><button class="btn primary" type="submit" aria-label="Send">${ico('send')}</button></form></div>`;
};
function drawChat(){
  const el=$('#chatMsgs');if(!el)return;
  el.innerHTML=CH.msgs.map(m=>m.typing?`<div class="msg bot dots"><i></i><i></i><i></i></div>`:`<div class="msg ${m.who}">${esc(m.text).replace(/\n/g,'<br>')}${m.links?`<div class="row">${m.links.map(l=>`<button class="btn sm primary" onclick="${l[1]}">${l[0]}</button>`).join('')}</div>`:''}</div>`).join('');
  el.scrollTop=el.scrollHeight;const last=[...CH.msgs].reverse().find(m=>m.who==='bot'&&!m.typing);
  $('#chatChips').innerHTML=(last&&last.chips||[]).map((c,i)=>`<button data-i="${i}" onclick="chatSay(this.textContent)">${esc(c)}</button>`).join('');
}
function chatSay(t){t=String(t).trim();if(!t)return;CH.msgs.push({who:'me',text:t});sendBot(t)}
function sendChat(e){e.preventDefault();const i=$('#chatIn'),t=i.value.trim();if(!t)return;i.value='';chatSay(t)}
function sendBot(t){
  CH.msgs.push({typing:true,who:'bot'});drawChat();
  setTimeout(()=>{CH.msgs=CH.msgs.filter(m=>!m.typing);let r;try{r=botReply(t)}catch(e){reportError(e,'assistant');r={text:'Sorry, I had trouble with that. Please try again or rephrase.'}}
    CH.msgs.push(Object.assign({who:'bot'},r));save();if(UI.view==='chat')drawChat()},500);
}
function micChat(){
  if(!SR)return toast('Voice input is not supported in this browser. Type your question instead.','bad');
  if(MIC)return;
  try{const rec=new SR();rec.lang='en-IN';rec.interimResults=false;
    rec.onresult=e=>{try{chatSay(e.results[0][0].transcript)}catch(x){}};
    rec.onerror=e=>toast(e.error==='not-allowed'||e.error==='service-not-allowed'?'Microphone permission was denied':'Could not hear you. Please try again.','bad');
    rec.onend=()=>{MIC=false};MIC=true;toast('Listening…');rec.start()}catch(e){MIC=false;toast('Voice input is unavailable right now','bad')}
}
const INTENTS=[['greet',/^(hi|hello|hey|namaste|good (morning|evening|afternoon))\b/],['thanks',/\b(thanks|thank you|thx)\b/],
 ['issue',/(not working|broken|leak|problem|issue|noise|smell|stuck|dirty)/],['temp',/\b(ac|a\/c|air ?con\w*|temperature|too (hot|cold|warm)|cooler|warmer)\b/],
 ['lights',/\blights?\b/],['late',/(late check|extend|extra night)/],['service',/(towel|pillow|blanket|toiletr|clean|housekeeping|laundry|room service|water bottle|soap)/],
 ['recommend',/(recommend|suggest|best room|which room|family|couple|budget|cheap|suite|quiet|view)/],['avail',/(available|availability|vacant|free room|rooms left|any room)/],
 ['price',/(price|rate|cost|tariff|charges?|how much)/],['book',/\b(book|reserve|reservation)\b/],['times',/(check ?-?in|check ?-?out|timing)/],
 ['wifi',/(wi-?fi|internet|password)/],['food',/(breakfast|lunch|dinner|restaurant|food|menu|cafe)/],['amen',/(pool|gym|spa|parking|amenit)/],['cancel',/cancel/],['help',/(help|what can you do)/]];
const ROOMRE=/\b([1-4]0[1-6])\b/,NEED=['issue','temp','lights','late','service'];
function botReply(raw){
  const t=raw.toLowerCase().trim();S.stats.queries++;
  if(CH.pending){const p=CH.pending;
    if(/^(cancel|never ?mind|no|stop)\b/.test(t)){CH.pending=null;return{text:'No problem, cancelled.'}}
    if(p.ask==='temp'){const m=t.match(/\b(1[89]|2[0-8])\b/);CH.pending=null;if(m)return roomIntent('temp','set '+m[1],p.room)}
    else{
      const m=t.match(/\b(\d{3})\b/),rest=t.replace(/\b\d{3}\b/g,' ').replace(/\b(room|in|it'?s|its|is|my|number|no|at|i am|im)\b/g,' ').replace(/[#.,!]/g,' ').trim();
      if(m&&!rest){
        if(ROOMRE.test(m[1])){CH.pending=null;return runIntent(p.intent,p.t,+m[1])}
        return{text:'I could not find room '+m[1]+'. Room numbers run from 101 to 406. Which room is it?'}}
      CH.pending=null}}
  let intent='fallback';for(const [k,re] of INTENTS)if(re.test(t)){intent=k;break}
  return runIntent(intent,t,null);
}
function runIntent(intent,t,rn){
  if(NEED.includes(intent)){
    const m=t.match(ROOMRE),sr=sessionRoom();
    const badNum=t.match(/\b(\d{3})\b/);
    if(UI.role==='staff'&&!rn&&!m&&badNum)return{text:'I could not find room '+badNum[1]+'. Room numbers run from 101 to 406.'};
    if(UI.role==='guest'&&!sr)return{text:'To protect your privacy I can only change or request things for a room after you sign in. Open My stay, enter your booking ID and mobile number, then ask me again.',links:[['Open My stay',"go('stay')"]]};
    const num=UI.role==='guest'?sr.number:(rn||(m&&+m[1]));
    if(!num){CH.pending={intent,t};return{text:'Sure. Which room number is this for? (for example 304)'}}
    const r=room(num);if(!r)return{text:'I could not find room '+num+'. Room numbers run from 101 to 406.'};
    if(r.status!=='occupied')return{text:'Room '+num+' does not have an active check-in, so I cannot change it or send requests for it.'};
    return roomIntent(intent,t,r);
  }
  switch(intent){
   case'greet':return{text:'Hello! How can I help with your stay today?',chips:['Rooms available today','Room prices','Wi-Fi password','Breakfast timings']};
   case'thanks':return{text:'You are welcome! Anything else I can do?'};
   case'avail':{const d=today(),c=Object.keys(TYPES).map(k=>k+': '+S.rooms.filter(r=>r.type===k&&r.status==='available'&&isFree(r,d,addDays(d,1))).length);return{text:'Rooms available tonight:\n'+c.join('\n'),links:[['Book a room',"go('book')"]],chips:['Room prices','Recommend a quiet room']}}
   case'price':return{text:'Nightly rates before '+S.settings.gst+'% GST:\n'+Object.keys(TYPES).map(k=>k+': '+inr(TYPES[k].price)).join('\n')+(S.settings.dynamic?'\nRates may change with demand.':'')+'\nTip: use code WELCOME10 for 10% off.',chips:['Rooms available today','Recommend a room for a family']};
   case'recommend':{
     const p={guests:/family|kids|children/.test(t)?4:/couple|two/.test(t)?2:1,type:/family/.test(t)?'Family':/suite|luxury/.test(t)?'Suite':/cheap|budget|cheapest/.test(t)?'Standard':'Any',view:'Any',floor:/high|top/.test(t)?'High':'Any',quiet:/quiet|peace/.test(t),budget:0};
     ['City','Garden','Pool','Hill'].forEach(v=>{if(t.includes(v.toLowerCase()))p.view=v});S.stats.recs++;
     const res=recommend(p,today(),addDays(today(),1)).slice(0,3);
     if(!res.length)return{text:'I could not find a free room for that tonight. Try another date on the booking page.',links:[['Open booking',"go('book')"]]};
     return{text:'Top picks for tonight:\n'+res.map(x=>'Room '+x.r.number+' · '+x.r.type+', '+x.r.view+' view · '+inr(priceFor(x.r,today()))+' · '+x.match+'% match').join('\n'),links:[['Book now',"PREFILL={type:'"+p.type+"'};go('book')"]]}}
   case'book':return{text:'I can help you book. Use the booking page and I will rank the best rooms for you.',links:[['Open booking',"go('book')"]]};
   case'times':return{text:'Check-in is from 2:00 PM and check-out is by 11:00 AM. Late check-out can be arranged for a fee, subject to availability.'};
   case'wifi':return{text:'Connect to "SmartStay-Guest". The password is welcome2026. Wi-Fi is free for all guests.'};
   case'food':return{text:'Breakfast is served 7:00–10:30 AM and the all-day café is open 11:00 AM–11:00 PM. You can order from the room service menu on My stay.',links:[['Open My stay',"go('stay')"]]};
   case'amen':return{text:'Pool: 6 AM–9 PM. Gym: 24 hours. Spa: 10 AM–8 PM, booking at the front desk. Parking is free for guests.'};
   case'cancel':return{text:'You can cancel free of charge from the My stay page before check-in.',links:[['Open My stay',"go('stay')"]]};
   case'help':return{text:'I can: check availability and rates, recommend a room, change AC or lights, request towels or cleaning, report a problem, and answer questions about timings, Wi-Fi and food.',chips:['Rooms available today','Extra towels please','AC too hot']};
   default:return{text:'I did not quite get that. I can help with availability, rates, room recommendations, AC and lights, housekeeping requests, or hotel information.',chips:['Rooms available today','Room prices','Recommend a room for a family','What can you do?']};
  }
}
function roomIntent(intent,t,r){
  if(typeof r==='number')r=room(r);
  if(intent==='temp'){
    const m=t.match(/\b(1[6-9]|2[0-9]|30)\b/);let set=null;
    if(m)set=clamp(+m[1],18,28);else if(/(hot|warm|cooler)/.test(t))set=clamp(r.ac.set-2,18,28);else if(/(cold|warmer)/.test(t))set=clamp(r.ac.set+2,18,28);
    if(set===null){CH.pending={ask:'temp',room:r.id};return{text:'What temperature would you like? Tell me a number between 18 and 28, like "set AC to 23".',chips:['Set AC to 22','Set AC to 24','Set AC to 26']}}
    r.ac.set=set;r.ac.mode='cool';const b=booking(r.bookingId);if(b)b.pref.temp=set;note('info','Aria set Room '+r.number+' AC to '+set+'°C for the guest');save();
    return{text:'Done. Room '+r.number+' AC is set to '+set+'°C. It will reach it in a few minutes.'}}
  if(intent==='lights'){const on=!/\boff\b/.test(t);r.lights=on;save();return{text:'Lights in Room '+r.number+' are now '+(on?'on':'off')+'.'}}
  if(intent==='late'){addTask(r.id,'request','Late check-out request',null);note('warn','Room '+r.number+': late check-out requested');save();return{text:'I have asked the front desk about a late check-out for Room '+r.number+'. It is ₹500 per hour until 3 PM, subject to availability. They will confirm shortly.'}}
  if(intent==='issue'){const title=raw2title(t);S.tickets.unshift({id:'T'+S.tid++,roomId:r.id,title,detail:'Reported through AI assistant',severity:'medium',source:'Guest request',status:'open',assignee:'',created:Date.now()});r.flag=true;note('warn','Room '+r.number+': '+title);save();return{text:'I am sorry about that. I created a maintenance ticket for Room '+r.number+'. A technician will contact you soon.'}}
  const item=/towel/.test(t)?'Extra towels':/(pillow|blanket)/.test(t)?'Extra pillow or blanket':/laundry/.test(t)?'Laundry pick-up':/room service/.test(t)?'Room service':/water/.test(t)?'Water bottles':/(toiletr|soap)/.test(t)?'Toiletries':'Room cleaning';
  addTask(r.id,'request',item+' requested via AI assistant',null);note('warn','Room '+r.number+': guest requested "'+item+'"');save();
  return{text:'Done. I sent your request for "'+item+'" to housekeeping for Room '+r.number+'. Expected within 15 minutes.'};
}
const raw2title=t=>{const s=t.replace(ROOMRE,'').replace(/\s+/g,' ').trim();return (s.charAt(0).toUpperCase()+s.slice(1)).slice(0,70)||'Guest reported a problem'};

['go','goRooms','setTheme','openRole','staffLogin','signOutStaff','openBell','openMore','resetData','exportBookings','exportBackup','restoreDlg','restoreNow','downloadTxt','copyTxt',
 'completeTask','startTask','assignTask','resolveTicket','assignTicket','checkInBooking','checkOutBooking','cancelBooking','openMove','moveGuest','extendDlg','extendStay','orderFood','cartAdd','placeOrder',
 'submitFeedback','showBill','injectFault','askOut','openRoom','acMode','acStep','toggleLights','searchRooms','reviewRoom','applyPromo','confirmBooking','findStay','gTemp','gAC','gLights','guestReq','openKey','unlockDoor',
 'openReport','sendReport','saveGst','savePin','sendChat','chatSay','micChat','quickSearch','openGuest','calOpen','drawRooms','drawBookings','drawGuests','drawEnergy','drawStayLive','drawStayCtl','drawChat','drawQuote','syncDates']
 .forEach(n=>{if(typeof window[n]==='function')window[n]=guard(window[n],n)});

(function init(){
  try{localStorage.setItem('__t','1');localStorage.removeItem('__t')}catch(e){STORE_OK=false}
  UI=Object.assign(defaultUI(),lsGet(UKEY)||{});
  const stored=lsGet(KEY);
  if(validData(stored))S=stored;
  else{seed();if(stored)setTimeout(()=>toast('Saved data looked damaged, so the demo was reset.','bad'),400)}
  if(UI.role!=='guest'&&UI.role!=='staff')UI.role='guest';
  const h=(location.hash||'').replace('#','');if(h&&NAV[UI.role].some(n=>n[0]===h))UI.view=h;
  render();startSim();
})();
