<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SmartStay AI – Hotel Room Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
try{var u=JSON.parse(localStorage.getItem('smartstay.ui.v1')||'null');if(u&&u.theme)document.documentElement.setAttribute('data-theme',u.theme)}catch(e){}
</script>
<style>
:root{
  --bg:#eef2f6;--surface:#ffffff;--surface2:#f5f8fb;--ink:#0f1b2d;--muted:#566578;--line:#d9e2ea;
  --brand:#0e7c86;--brand-ink:#ffffff;--brand-soft:#d8eef0;--lamp:#f2a93b;--lamp-soft:#fdf0d8;
  --ok:#1b8f5a;--ok-soft:#d9f2e5;--occ:#b9760f;--occ-soft:#fdebc8;--clean:#7a4fc2;--clean-soft:#ebe2fa;--bad:#c13a2f;--bad-soft:#fbe2df;--info:#2f64c4;--info-soft:#dde8fa;
  --side:#0b1626;--side-ink:#c9d6e6;--shadow:0 1px 2px rgba(15,27,45,.06),0 10px 30px rgba(15,27,45,.07);
  --font-head:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --font-body:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08111e;--surface:#101d2f;--surface2:#142339;--ink:#e7eef7;--muted:#93a5ba;--line:#223650;
  --brand:#3cc0cb;--brand-ink:#06232a;--brand-soft:#12353d;--lamp:#f6b650;--lamp-soft:#3a2d14;
  --ok:#47c98a;--ok-soft:#133526;--occ:#f0b04a;--occ-soft:#3b2d12;--clean:#a98af0;--clean-soft:#2a2046;--bad:#f27a6e;--bad-soft:#3d1d1a;--info:#7aa5f2;--info-soft:#172a4a;
  --side:#050b14;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{
  --bg:#08111e;--surface:#101d2f;--surface2:#142339;--ink:#e7eef7;--muted:#93a5ba;--line:#223650;
  --brand:#3cc0cb;--brand-ink:#06232a;--brand-soft:#12353d;--lamp:#f6b650;--lamp-soft:#3a2d14;
  --ok:#47c98a;--ok-soft:#133526;--occ:#f0b04a;--occ-soft:#3b2d12;--clean:#a98af0;--clean-soft:#2a2046;--bad:#f27a6e;--bad-soft:#3d1d1a;--info:#7aa5f2;--info-soft:#172a4a;
  --side:#050b14;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--font-body);min-height:100vh}
h1,h2,h3,h4{font-family:var(--font-head);margin:0;letter-spacing:-.01em;line-height:1.15}
h1{font-size:clamp(30px,5.2vw,52px);font-weight:800}
h2{font-size:clamp(22px,3vw,28px);font-weight:800}
h3{font-size:17px;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:8px}
.muted{color:var(--muted)}.small{font-size:13px}.right{text-align:right}.nowrap{white-space:nowrap}
.ico{flex:none;vertical-align:-4px}
/* layout */
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px;gap:6px;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 18px;color:#fff}
.brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#0e7c86,#16a3a0);display:grid;place-items:center;color:#fff}
.brand b{font:800 18px var(--font-head)}.brand small{display:block;color:#7f93ab;font-size:12px}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:0;border-radius:12px;background:none;color:var(--side-ink);text-align:left;font-weight:500;min-height:44px}
.nav-btn:hover{background:rgba(255,255,255,.07)}
.nav-btn[aria-current="page"]{background:rgba(242,169,59,.16);color:#ffd48d;font-weight:700}
.side .sp{flex:1}
.side-foot{border-top:1px solid rgba(255,255,255,.1);padding-top:12px;display:grid;gap:6px}
.content{min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:12px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h2{font-size:20px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .mlogo{display:none}
main{padding:26px 28px 56px;max-width:1320px;margin:0 auto;width:100%}
.iconbtn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:44px;height:44px;padding:0 12px;border:1px solid var(--line);background:var(--surface);border-radius:12px}
.iconbtn:hover{border-color:var(--brand)}
.badge{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;border-radius:999px;min-width:19px;height:19px;display:grid;place-items:center;padding:0 5px}
.live{display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:600;color:var(--muted);padding:0 4px}
.live i{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 2s infinite}
.live.off i{background:var(--muted);animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 8px transparent}}
.bnav{display:none}
@media (max-width:999px){
  .app{display:block}.side{display:none}
  .top{padding:10px 14px}.top .mlogo{display:grid;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#0e7c86,#16a3a0);place-items:center;color:#fff}
  .top h2{font-size:18px}.live span{display:none}
  main{padding:18px 14px calc(96px + env(safe-area-inset-bottom,0px))}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
  .bnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 2px;min-height:52px;border-radius:12px}
  .bnav button[aria-current="page"]{color:var(--brand)}
  .bnav button[aria-current="page"] .ico{stroke-width:2.4}
}
/* ui parts */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card h3{margin-bottom:12px}
.page-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.page-head p{color:var(--muted);margin-top:4px}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr))}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.row.end{justify-content:flex-end;margin-top:18px}.row.between{justify-content:space-between}
.stack{display:grid;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid transparent;font-weight:700;background:var(--surface2);border-color:var(--line);transition:transform .08s,background .15s}
.btn:hover{border-color:var(--brand)}.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.lamp{background:var(--lamp);color:#2b1c00;border-color:var(--lamp)}
.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.lg{min-height:52px;padding:0 26px;font-size:16px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.occ{background:var(--occ-soft);color:var(--occ)}.chip.warn{background:var(--clean-soft);color:var(--clean)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.info{background:var(--info-soft);color:var(--info)}.chip.brand{background:var(--brand-soft);color:var(--brand)}.chip.neutral{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.kpi{display:flex;gap:14px;align-items:center;padding:16px 18px}
.kpi .bub{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--brand-soft);color:var(--brand)}
.kpi .v{font:800 28px/1 var(--font-head)}.kpi .l{color:var(--muted);font-size:13px;margin-top:4px}
.kpi.lamp .bub{background:var(--occ-soft);color:var(--occ)}.kpi.bad .bub{background:var(--bad-soft);color:var(--bad)}.kpi.ok .bub{background:var(--ok-soft);color:var(--ok)}.kpi.clean .bub{background:var(--clean-soft);color:var(--clean)}
.field{display:grid;gap:6px}.field label,.lbl{font-weight:600;font-size:13px}
input[type=text],input[type=tel],input[type=email],input[type=date],input[type=search],input[type=password],select,textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface2)}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
input[type=range]{width:100%;accent-color:var(--brand)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.check{display:flex;gap:10px;align-items:center;min-height:44px;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--brand)}
.err{background:var(--bad-soft);color:var(--bad);padding:10px 12px;border-radius:10px;font-weight:600;font-size:14px}
.note{background:var(--brand-soft);color:var(--ink);padding:10px 12px;border-radius:10px;font-size:14px}
.item{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0;padding-bottom:0}.item:first-child{padding-top:0}
.item .main{min-width:0;flex:1 1 220px}.item b{font-weight:700}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1px solid var(--line);background:var(--surface);padding:0 14px;min-height:40px;border-radius:999px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{height:9px;background:var(--surface2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.bar.hot i{background:var(--occ)}.bar.bad i{background:var(--bad)}
.statusbar{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px}
.statusbar i{display:block;min-width:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-top:10px}
.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart{width:100%;height:auto;display:block}.chart text{fill:var(--muted);font:11px var(--font-body)}
.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}
th{font-size:12px;text-align:left;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}td{padding:10px;border-bottom:1px solid var(--line);font-size:14px}
tr:last-child td{border-bottom:0}
.split{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface2)}
.stepper button{width:44px;height:44px;border:0;background:none;font-size:20px;font-weight:700}
.stepper button:hover{background:var(--brand-soft)}.stepper output{min-width:62px;text-align:center;font-weight:800;font-family:var(--font-head);font-size:18px}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg2 button{border:0;background:var(--surface2);padding:0 16px;min-height:44px;font-weight:600}
.seg2 button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.switch{display:inline-flex;align-items:center;gap:10px;font-weight:600;min-height:44px;cursor:pointer}
.switch input{position:absolute;opacity:0}
.switch span{width:46px;height:26px;border-radius:99px;background:var(--line);position:relative;transition:.2s;flex:none}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked+span{background:var(--brand)}.switch input:checked+span::after{left:23px}
.switch input:focus-visible+span{outline:3px solid var(--brand);outline-offset:2px}
/* hero + facade */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr);gap:28px;align-items:center;background:var(--side);color:#e9f0f8;border-radius:26px;padding:clamp(22px,4vw,48px);overflow:hidden;position:relative}
.hero h1{color:#fff}.hero p.lead{color:#b9c8da;font-size:17px;max-width:46ch;margin:16px 0 24px}
.hero .stats{display:flex;flex-wrap:wrap;gap:24px;margin-top:26px;color:#b9c8da;font-size:14px}
.hero .stats b{display:block;font:800 26px var(--font-head);color:#ffd48d}
.hero .btn.ghost{color:#e9f0f8;border-color:rgba(255,255,255,.28)}
.facade{background:#0f2036;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:16px 16px 0}
.facade .fl{display:grid;grid-template-columns:22px repeat(6,1fr);gap:7px;align-items:center;margin-bottom:7px}
.facade .fl em{font-style:normal;font-size:11px;color:#6f86a3;text-align:center}
.facade .w{aspect-ratio:1/1.15;border-radius:5px 5px 2px 2px;background:#18304b;border:1px solid #243f5e;display:block}
.facade .w.occupied{background:#f6b650;border-color:#ffd48d;box-shadow:0 0 14px rgba(246,182,80,.55)}
.facade .w.occupied.away{background:#b98a3e;box-shadow:none}
.facade .w.cleaning{background:#7a4fc2;border-color:#a98af0}.facade .w.maintenance{background:#c13a2f;border-color:#f27a6e}
.facade .ground{height:14px;margin:6px -16px 0;background:#162b44;border-radius:0 0 18px 18px}
.facade-key{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:#8ea3bd;padding:10px 0 12px}
.facade-key b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.rt{display:flex;flex-direction:column;gap:10px}
.rt .price{font:800 22px var(--font-head)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;counter-reset:s}
.steps div{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;counter-increment:s}
.steps div::before{content:counter(s);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--lamp);color:#2b1c00;font-weight:800;margin-bottom:10px}
.steps b{display:block;margin-bottom:2px}
/* rooms */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.rcard{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:14px;padding:12px 14px;min-height:118px}
.rcard:hover{box-shadow:var(--shadow)}
.rcard.st-occupied{border-left-color:var(--occ)}.rcard.st-cleaning{border-left-color:var(--clean)}.rcard.st-maintenance{border-left-color:var(--bad)}
.rc-top{display:flex;justify-content:space-between;align-items:center;gap:6px}.rn{font:800 24px var(--font-head)}
.rc-sub{font-size:12px;color:var(--muted)}.rc-meta{display:flex;gap:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}.rc-foot{margin-top:auto;font-weight:600;font-size:13px}
.match{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font:800 15px var(--font-head);background:conic-gradient(var(--brand) calc(var(--p)*1%),var(--line) 0);position:relative;flex:none}
.match::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--surface)}.match span{position:relative}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rec{display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}.rec:last-child{border-bottom:0}
.rec .info{flex:1 1 240px;min-width:0}
/* modal */
.mroot{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.mroot[hidden]{display:none}
.mback{position:absolute;inset:0;background:rgba(5,12,22,.6)}
.modal{position:relative;background:var(--surface);border-radius:22px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(14px);opacity:0}}
.mclose{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:12px;border:0;background:var(--surface2);display:grid;place-items:center}
.modal h2,.modal h3{padding-right:40px}.modal h3{margin-bottom:6px}
.mhead{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding-right:44px;margin-bottom:16px}
.mhead h2{padding:0}.eyebrow{font-size:13px;color:var(--muted);font-weight:600}
.live-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.live-grid div{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.live-grid b{display:block;font:800 19px var(--font-head)}.live-grid small{color:var(--muted)}
@media (max-width:640px){.mroot{align-items:flex-end;padding:0}.modal{border-radius:22px 22px 0 0;max-height:92vh;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}}
.toasts{position:fixed;z-index:200;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;width:min(92vw,420px);pointer-events:none}
@media (min-width:1000px){.toasts{bottom:28px}}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:600;box-shadow:var(--shadow);animation:pop .2s}
.toast.bad{background:var(--bad);color:#fff}.toast.ok{background:var(--ok);color:#fff}
/* chat */
.chat{display:flex;flex-direction:column;height:min(640px,calc(100vh - 220px));min-height:420px;padding:0;overflow:hidden}
.msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:min(520px,86%);padding:11px 14px;border-radius:16px;line-height:1.45;word-wrap:break-word}
.msg.bot{background:var(--surface2);border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start}
.msg.me{background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:4px;align-self:flex-end}
.msg .row{margin-top:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 14px 10px;scrollbar-width:thin}
.chips button{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;min-height:38px;padding:0 14px;font-weight:600;color:var(--brand)}
.cform{display:flex;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.cform input{flex:1}
.dots i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.25}}
.foot{margin-top:34px;text-align:center;color:var(--muted);font-size:13px}

'use strict';
/* =====================  UTILITIES  ===================== */

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;

const iso=d=>{const z=d.getTimezoneOffset()*60000;return new Date(d-z).toISOString().slice(0,10)};

const ICON={

 key:'M15 7a4 4 0 1 1-1.5 3L4 19.5V21h2v-2h2v-2h2l3-3',bell:'M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4',

/* =====================  DATA / SEED  ===================== */
const TYPES={
 Standard:{price:3500,cap:2,beds:'1 Queen bed',desc:'Efficient and calm. Ideal for solo travellers and couples.'},

function newId(){return 'SS'+(S.seq++)}
function note(type,msg){S.alerts.unshift({t:Date.now(),type,msg});if(S.alerts.length>60)S.alerts.pop();if(type==='info')S.stats.actions++}

function seed(){
  seedv=7;const t=today();
  S={v:1,seq:10001,tid:1,rooms:[],bookings:[],tasks:[],tickets:[],alerts:[],history:[],
     settings:{auto:true,dynamic:false,speed:1,running:true},
     energy:{kwh:142.6,saved:31.4,load:0,series:[]},stats:{recs:0,queries:0,actions:0,anoms:0}};
  const layout={1:['Standard','Standard','Standard','Standard','Family','Family'],2:['Standard','Standard','Standard','Deluxe','Deluxe','Deluxe'],

  [[104,0,2,'9123456780'],[206,0,1],[302,1,3],[402,2,2],[106,3,2],[406,1,4],[305,2,2],[201,4,2],[403,5,2],[405,3,3]].forEach((x,i)=>{

  for(let d=28;d>=1;d--){const date=addDays(t,-d),dow=new Date(date).getDay();

/* =====================  DOMAIN LOGIC  ===================== */
function isFree(r,ci,co,ignore){
  if(r.status==='maintenance'&&ci<=addDays(today(),1))return false;
  return !S.bookings.some(b=>b.roomId===r.id&&(b.status==='booked'||b.status==='checked-in')&&b.id!==ignore&&b.checkIn<co&&b.checkOut>ci);
}
function occOn(d){return S.bookings.filter(b=>(b.status==='booked'||b.status==='checked-in')&&b.checkIn<=d&&b.checkOut>d).length/S.rooms.length}
function forecast(d){
  const dow=new Date(d+'T00:00:00').getDay();
  const same=S.history.filter(h=>new Date(h.date+'T00:00:00').getDay()===dow).map(h=>h.occ);
  const base=avg(same),known=occOn(d)*100,ahead=nightsBetween(today(),d)-(d===today()?1:0);
  const w=clamp(.85-ahead*.1,.25,.85);
  return Math.round(clamp(Math.max(known,known*w+base*(1-w)),0,100));
}
function priceMult(d){const f=forecast(d);return f<45?.9:f<70?1:f<85?1.1:1.2}
function priceFor(r,d){return Math.round(r.price*(S.settings.dynamic?priceMult(d):1))}
function stayTotal(r,ci,co){let s=0,n=nightsBetween(ci,co);for(let i=0;i<n;i++)s+=priceFor(r,addDays(ci,i));return Math.round(s*1.12)}
function occFrac(f){return S.rooms.filter(r=>r.floor===f&&r.status==='occupied').length/6}
function profileOf(email,phone){
  const past=S.bookings.filter(b=>(email&&b.email===email)||(phone&&b.phone===phone));
  if(!past.length)return null;const cnt={};past.forEach(b=>{const r=room(b.roomId);if(r)cnt[r.type]=(cnt[r.type]||0)+1});
  const type=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];return type?{type,n:past.length}:null;
}
/* AI: smart room allocation (weighted preference scoring) */
function recommend(p,ci,co){
  const prof=profileOf(p.email,p.phone),out=[];
  for(const r of S.rooms){
    if(r.cap<p.guests||!isFree(r,ci,co))continue;
    const parts=[],add=(label,pts,max)=>parts.push({label,pts,max});
    add('Right size for '+p.guests+' guest'+(p.guests>1?'s':''),Math.max(0,10-(r.cap-p.guests)*2.5),10);
    if(p.type&&p.type!=='Any')add(r.type+' room',r.type===p.type?30:0,30);
    if(p.view&&p.view!=='Any')add(r.view+' view',r.view===p.view?15:0,15);
    if(p.floor==='High')add('High floor',Math.min(12,r.floor*3),12);
    if(p.floor==='Low')add('Low floor',Math.min(12,(5-r.floor)*3),12);
    if(p.quiet)add('Quiet end of corridor',r.quiet?15:0,15);
    if(p.budget>0)add('Within budget',priceFor(r,ci)<=p.budget?20:0,20);
    if(prof)add('Matches your past stays',r.type===prof.type?8:0,8);
    add('Placed with occupied rooms to save energy',occFrac(r.floor)*6,6);
    const pts=parts.reduce((a,x)=>a+x.pts,0),max=parts.reduce((a,x)=>a+x.max,0);
    out.push({r,match:clamp(Math.round(pts/max*100),35,99),reasons:parts.filter(x=>x.pts>=x.max*.6&&x.pts>0).map(x=>x.label),returning:!!prof});
  }
  return out.sort((a,b)=>b.match-a.match||a.r.price-b.r.price);
}
function addTask(roomId,type,noteTxt,reason,created){
  S.tasks.push({id:'H'+(S.tid++),roomId,type,note:noteTxt,reason:reason||'',status:'pending',created:created||Date.now()});
}
function taskScore(t){
  const r=room(t.roomId);let s={checkout:55,request:45,daily:25}[t.type]||20;
  if(t.type==='checkout'&&S.bookings.some(b=>b.roomId===t.roomId&&b.status==='booked'&&b.checkIn===today()))s+=35;
  s+=Math.min(20,(Date.now()-t.created)/180000);
  if(t.type==='daily')s+=clamp((r.usage-40)/2,0,15);
  return Math.round(s);
}
const prio=s=>s>=85?['bad','High']:s>=55?['occ','Medium']:['neutral','Low'];
function predictHK(silent){
  for(const r of S.rooms){
    if(r.status==='occupied'&&r.usage>=45&&!S.tasks.some(t=>t.roomId===r.id&&t.status!=='done'&&(t.type==='daily'))){
      addTask(r.id,'daily','Daily service','AI prediction: usage index '+Math.round(r.usage)+' (high in-room activity)');
      if(!silent)note('info','AI scheduled a daily service for Room '+r.number);
    }
  }
}
function completeTask(id){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;t.status='done';t.done=Date.now();
  const r=room(t.roomId);r.usage=0;r.lastCleaned=Date.now();
  if(r.status==='cleaning'&&!S.tasks.some(x=>x.roomId===r.id&&x.status!=='done'&&x.type==='checkout'))r.status='available';
  note('ok','Room '+r.number+' is clean and '+(r.status==='available'?'ready for the next guest':'serviced'));save();render();toast('Room '+r.number+' marked as clean','ok');
}
function startTask(id){const t=S.tasks.find(x=>x.id===id);if(t){t.status='in-progress';save();render()}}
function raiseTicket(r,title,detail,severity,source){
  if(S.tickets.some(t=>t.roomId===r.id&&t.status!=='resolved'&&t.source==='AI anomaly detection'))return;
  S.tickets.unshift({id:'T'+S.tid++,roomId:r.id,title,detail,severity,source:source||'AI anomaly detection',status:'open',assignee:'',created:Date.now()});
  r.flag=true;S.stats.anoms++;
  let extra='';
  if(r.status==='occupied'){const alt=S.rooms.find(x=>x.status==='available'&&x.type===r.type&&isFree(x,today(),addDays(today(),1)));extra=alt?' Guest affected – AI suggests moving to Room '+alt.number+'.':' Guest affected – no same-type room free.'}
  else r.status='maintenance';
  note('danger','Room '+r.number+': '+title+'.'+extra);toast('AI alert: '+title+' in Room '+r.number,'bad');
  if(UI&&UI.view==='maintenance')render();
}
function resolveTicket(id){
  const t=S.tickets.find(x=>x.id===id);if(!t)return;t.status='resolved';t.resolved=Date.now();
  const r=room(t.roomId);
  if(!S.tickets.some(x=>x.roomId===r.id&&x.status!=='resolved')){r.flag=false;r.fault=null;r.hot=0;r.pw=[];if(r.status==='maintenance')r.status='available'}
  note('ok','Ticket resolved for Room '+r.number+': '+t.title);save();render();toast('Ticket resolved','ok');
}
function assignTicket(id,v){const t=S.tickets.find(x=>x.id===id);if(t){t.assignee=v;t.status=v?'assigned':'open';save();render()}}

/* Booking operations */
function createBooking(f,r){
  const b={id:newId(),name:f.name,phone:f.phone,email:f.email,roomId:r.id,checkIn:f.ci,checkOut:f.co,guests:f.guests,
    pref:{temp:f.temp,type:f.type},status:'booked',total:stayTotal(r,f.ci,f.co),created:Date.now()};
  S.bookings.push(b);note('ok','New booking '+b.id+' – Room '+r.number+' for '+b.name);save();return b;
}
function checkInBooking(id,quiet){
  const b=booking(id),r=b&&room(b.roomId);if(!b||!r)return false;
  const fail=m=>{toast(m,'bad');return false};
  if(b.status!=='booked')return fail('This booking is not waiting for check-in');
  if(b.checkIn>today())return fail('Check-in opens on '+fdate(b.checkIn));
  if(r.status==='occupied')return fail('Room '+r.number+' is still occupied');
  if(r.status==='cleaning')return fail('Room '+r.number+' is being cleaned – it will be ready shortly');
  if(r.status==='maintenance')return fail('Room '+r.number+' is under maintenance');
  b.status='checked-in';r.status='occupied';r.bookingId=b.id;r.lights=true;r.presence=true;r.vacantMin=0;r.usage=0;r.pw=[];
  r.ac={mode:'cool',set:b.pref.temp||24};
  note('ok','Smart check-in: Room '+r.number+' pre-cooled to '+r.ac.set+'°C for '+b.name);save();
  if(!quiet)toast('Checked in – Room '+r.number+' is set to '+r.ac.set+'°C','ok');
  render();return true;
}
function checkOutBooking(id){
  const b=booking(id),r=b&&room(b.roomId);if(!b||b.status!=='checked-in')return;
  b.status='checked-out';b.outAt=Date.now();r.status='cleaning';r.bookingId=null;r.ac={mode:'off',set:24};r.lights=false;r.presence=false;r.pw=[];r.fault=null;
  addTask(r.id,'checkout','Guest checked out',null);
  note('ok',b.name+' checked out of Room '+r.number+' – cleaning scheduled');save();closeModal();render();showBill(b);
}
function cancelBooking(id){const b=booking(id);if(b&&b.status==='booked'){b.status='cancelled';note('warn','Booking '+id+' cancelled');save();render();toast('Booking '+id+' cancelled')}}
function showBill(b){
  const r=room(b.roomId),n=nightsBetween(b.checkIn,b.checkOut),sub=Math.round(b.total/1.12);
  openModal(`<h3>Receipt – ${esc(b.id)}</h3><p class="muted small">${esc(b.name)} · Room ${r.number} (${r.type})</p>
   <div class="stack" style="margin-top:14px"><div class="row between"><span>${n} night${n>1?'s':''} · ${fdate(b.checkIn)} – ${fdate(b.checkOut)}</span><b>${inr(sub)}</b></div>
   <div class="row between"><span class="muted">GST 12%</span><span>${inr(b.total-sub)}</span></div>
   <div class="row between" style="border-top:1px solid var(--line);padding-top:12px"><b>Total</b><b style="font:800 24px var(--font-head)">${inr(b.total)}</b></div></div>
   <div class="row end"><button class="btn primary" onclick="closeModal()">Done</button></div>`);
}

/* =====================  IoT SIMULATION + AI CONTROL  ===================== */
function tick(silent){
  const dt=5;let tot=0,base=0;
  for(const r of S.rooms){
    if(r.status==='occupied'){
      if(r.presence){if(Math.random()<.1)r.presence=false}else if(Math.random()<.2)r.presence=true;
      if(r.presence){r.vacantMin=0;r.usage+=1.3}else r.vacantMin+=dt;
    }else{r.presence=false;r.vacantMin=0}
    if(S.settings.auto){
      if(r.status==='occupied'){
        if(!r.presence&&r.vacantMin>=15){
          if(r.ac.mode==='cool'){r.ac.mode='eco';if(!silent)note('info','Room '+r.number+' empty for '+r.vacantMin+' min – AC set to eco, lights off')}
          r.lights=false;
        }else if(r.presence){
          if(r.ac.mode==='eco'){r.ac.mode='cool';if(!silent)note('ok','Guest is back in Room '+r.number+' – comfort restored')}
          r.lights=true;
        }
      }else{r.ac.mode='off';r.lights=false}
    }
    const eff=r.ac.mode==='cool'?r.ac.set:r.ac.mode==='eco'?r.ac.set+3:null;
    let target=eff!==null?eff:29;
    if(r.fault==='ac')target=Math.max(target,34);
    const rate=(eff!==null&&r.fault!=='ac')?.9:.4;
    r.temp+=Math.sign(target-r.temp)*Math.min(Math.abs(target-r.temp),rate)+(Math.random()-.5)*.1;
    let kw=r.lights?.06:0;
    if(eff!==null)kw+=(r.ac.mode==='eco'?.28:.5)+Math.min(.7,Math.max(0,r.temp-eff)*.1)+(Math.random()-.5)*.06;
    if(r.fault==='ac')kw+=1.6+Math.random()*.5;
    if(r.fault==='surge'&&Math.random()<.6)kw+=1.8+Math.random()*1.2;
    r.kw=+kw.toFixed(2);
    /* anomaly detection: z-score on a rolling baseline of steady-state power draw */
    const sig=r.status+r.ac.mode+r.ac.set;
    if(sig!==r.sig){r.sig=sig;r.pw=[];r.hot=0}
    const prev=r.pw.slice();r.pw.push(r.kw);if(r.pw.length>14)r.pw.shift();
    if(prev.length>=6&&!silent){
      const m=avg(prev),sd=Math.sqrt(avg(prev.map(x=>(x-m)**2))),z=(r.kw-m)/(sd+.06);
      if(z>4&&r.kw-m>.9)raiseTicket(r,'Abnormal power draw','Power jumped to '+r.kw.toFixed(2)+' kW against a baseline of '+m.toFixed(2)+' kW (z-score '+z.toFixed(1)+').','high');
      if(eff!==null&&r.temp-eff>3.8){r.hot++;if(r.hot>=3)raiseTicket(r,'AC not cooling','Room is '+r.temp.toFixed(1)+'°C against a set point of '+eff+'°C for '+r.hot+' readings.','high')}else r.hot=0;
    }
    tot+=r.kw;base+=r.status==='occupied'?.62:0;
  }
  S.energy.kwh+=tot*dt/60;S.energy.saved+=Math.max(0,base-tot)*dt/60;S.energy.load=tot;
  S.energy.series.push({a:+tot.toFixed(2),b:+base.toFixed(2)});if(S.energy.series.length>36)S.energy.series.shift();
  predictHK(silent);
  if(!silent){save();refreshLive()}
}

function barChart(items,o){
  o=o||{};const W=520,H=o.h||190,L=34,R=8,T=14,B=28,n=items.length;
  const max=o.max||Math.max(1,...items.map(i=>Math.max(i.value,i.value2||0)));
  const iw=(W-L-R)/n,bw=Math.min(40,iw*.55),hh=v=>(H-T-B)*v/max;let g='';
  [0,.5,1].forEach(f=>{const y=T+(H-T-B)*(1-f);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+4}" text-anchor="end">${Math.round(max*f)}${o.unit||''}</text>`});
  items.forEach((it,i)=>{const x=L+iw*i+(iw-bw)/2;
    if(it.value2!=null)g+=`<rect x="${x}" y="${H-B-hh(it.value2)}" width="${bw}" height="${hh(it.value2)}" rx="5" fill="var(--lamp)" opacity=".55"/>`;
    g+=`<rect x="${x}" y="${H-B-hh(it.value)}" width="${bw}" height="${Math.max(0,hh(it.value))}" rx="5" fill="var(--brand)"/><text x="${x+bw/2}" y="${H-9}" text-anchor="middle">${it.label}</text>`;
    if(o.labels)g+=`<text x="${x+bw/2}" y="${H-B-hh(Math.max(it.value,it.value2||0))-5}" text-anchor="middle" style="fill:var(--ink);font-weight:700">${Math.round(Math.max(it.value,it.value2||0))}${o.unit||''}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Chart')}">${g}</svg>`;
}
function lineChart(series,o){
  o=o||{};const W=520,H=200,L=38,R=10,T=12,B=20,n=series[0].data.length;
  const max=Math.max(1,...series.flatMap(s=>s.data))*1.15,X=i=>L+(W-L-R)*i/Math.max(1,n-1),Y=v=>H-B-(H-T-B)*v/max;let g='';
  [0,.5,1].forEach(f=>{const y=T+(H-T-B)*(1-f);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+4}" text-anchor="end">${(max*f).toFixed(0)}</text>`});
  series.forEach((s,k)=>{const d=s.data.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
    if(k===0)g+=`<path d="${d} L${X(n-1)} ${H-B} L${X(0)} ${H-B}Z" fill="${s.color}" opacity=".13"/>`;
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.4" stroke-linejoin="round" ${s.dash?'stroke-dasharray="6 5"':''}/>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Chart')}">${g}</svg>`;
}

}

function acMode(id,m){const r=room(id);r.ac.mode=m;if(m==='cool'&&r.status==='occupied')r.lights=true;save();openRoom(id)}

function searchRooms(e){
  e.preventDefault();const v=id=>$('#'+id).value.trim(),f={name:v('bn'),phone:v('bp'),email:v('be'),ci:v('bci'),co:v('bco'),guests:+v('bg'),type:v('bt'),view:v('bv'),floor:v('bf'),budget:+v('bb'),quiet:$('#bq').checked,temp:+v('btemp')};

   ${res.length?res.map((x,i)=>{const r=x.r,tot=stayTotal(r,f.ci,f.co);return `<div class="rec"><div class="match" style="--p:${x.match}"><span>${x.match}%</span></div>

/* ---- Housekeeping ---- */
VIEWS.housekeeping=()=>{
  const open=S.tasks.filter(t=>t.status!=='done').map(t=>({t,s:taskScore(t)})).sort((a,b)=>b.s-a.s);
  const done=S.tasks.filter(t=>t.status==='done').sort((a,b)=>b.done-a.done).slice(0,4);
  const byFloor={};open.forEach(x=>{const f=room(x.t.roomId).floor;byFloor[f]=(byFloor[f]||0)+x.s});
  const route=Object.keys(byFloor).sort((a,b)=>byFloor[b]-byFloor[a]);
  const occ=S.rooms.filter(r=>r.status==='occupied').sort((a,b)=>b.usage-a.usage);
  return `<div class="page-head"><div><h2>Housekeeping</h2><p>AI ranks tasks by urgency, arrivals and room usage.</p></div></div>
  <div class="grid g-2"><div class="card"><h3>Task queue (${open.length})</h3>${route.length>1?`<div class="note small" style="margin-bottom:12px"><b>Suggested route:</b> ${route.map(f=>'Floor '+f).join(' → ')} (fewest trips for the highest priority)</div>`:''}
   ${open.length?open.map(({t,s})=>{const r=room(t.roomId),p=prio(s);return `<div class="item"><div class="main"><b>Room ${r.number}</b> ${chip(p[0],p[1]+' priority')} ${t.status==='in-progress'?chip('info','In progress'):''}

   ${done.length?`<h3 style="margin-top:20px">Recently completed</h3>${done.map(t=>`<div class="item small"><span>Room ${t.roomId} · ${esc({checkout:'Checkout clean',daily:'Daily service',request:'Request'}[t.type])}</span><span class="muted">${ago(t.done)}</span></div>`).join('')}`:''}</div>
   <div class="card"><h3>Predicted cleaning need (occupied rooms)</h3><p class="muted small" style="margin-bottom:12px">AI tracks in-room activity. At 100% a daily service is scheduled automatically.</p>

  return `<div class="page-head"><div><h2>Energy & IoT</h2><p>Sensors report every few seconds. AI turns down empty rooms and flags faults.</p></div></div>
  <div class="card flat" style="margin-bottom:16px"><div class="row between"><div class="row"><button class="btn ${S.settings.running?'':'primary'}" onclick="S.settings.running=!S.settings.running;startSim();save();render()">${S.settings.running?'Pause sensors':'Resume sensors'}</button>
   <div class="seg2" role="group" aria-label="Simulation speed">${[1,2,4].map(s=>`<button aria-pressed="${S.settings.speed===s}" onclick="S.settings.speed=${s};startSim();save();render()">${s}×</button>`).join('')}</div></div>
   <label class="switch"><input type="checkbox" ${S.settings.auto?'checked':''} onchange="S.settings.auto=this.checked;save();toast('AI auto-control '+(this.checked?'on':'off'));render()"><span></span>AI auto-control</label></div></div>
  <div id="energyLive"></div>
  <div class="card" style="margin-top:16px"><h3>Fault simulator</h3><p class="muted small" style="margin-bottom:12px">Inject a fault into an occupied room. The anomaly detector compares power and temperature against the room's normal pattern and raises a maintenance ticket within seconds.</p>
   <div class="row"><select id="fltRoom" style="max-width:190px" aria-label="Room">${occ.map(r=>`<option value="${r.id}">Room ${r.number}</option>`).join('')||'<option value="">No occupied rooms</option>'}</select>
   <select id="fltType" style="max-width:240px" aria-label="Fault type"><option value="ac">AC compressor failure</option><option value="surge">Electrical power surge</option></select>
   <button class="btn danger" onclick="injectFault()" ${occ.length?'':'disabled'}>${ico('bolt')} Inject fault</button></div></div>`;
};
function drawEnergy(){
  const el=$('#energyLive');if(!el)return;const e=S.energy,occ=S.rooms.filter(r=>r.status==='occupied');
  el.innerHTML=`<div class="grid g-kpi">${kpi('lamp','bolt',e.load.toFixed(1)+' kW','Current hotel load')}${kpi('','chart',Math.round(e.kwh)+' kWh','Energy used today')}${kpi('ok','leaf',Math.round(e.saved)+' kWh','Saved by AI')}${kpi('ok','user',inr(e.saved*8),'Estimated savings')}</div>
  <div class="grid g-2" style="margin-top:16px"><div class="card"><h3>Load: with AI vs without</h3>${lineChart([{data:e.series.map(x=>x.a),color:'var(--brand)'},{data:e.series.map(x=>x.b),color:'var(--lamp)',dash:1}],{label:'Hotel power load in kilowatts'})}
   <div class="legend"><span><b style="background:var(--brand)"></b>Actual (AI-controlled)</span><span><b style="background:var(--lamp)"></b>Always-on baseline</span></div></div>
   <div class="card"><h3>Occupied rooms</h3><div class="tablewrap"><table><thead><tr><th>Room</th><th>Sensor</th><th>Temp</th><th>AC</th><th>Power</th></tr></thead><tbody>${occ.map(r=>`<tr><td><b>${r.number}</b></td><td>${r.presence?chip('occ','In room'):chip('neutral','Away '+r.vacantMin+'m')}</td><td>${r.temp.toFixed(1)}°C</td><td>${r.ac.mode==='eco'?chip('ok','Eco'):r.ac.mode==='cool'?r.ac.set+'°C':'Off'}</td><td>${r.kw.toFixed(2)} kW</td></tr>`).join('')}</tbody></table></div></div></div>`;
}

/* ---- Maintenance ---- */
VIEWS.maintenance=()=>{
  const open=S.tickets.filter(t=>t.status!=='resolved'),done=S.tickets.filter(t=>t.status==='resolved').slice(0,5);
  const health=S.rooms.map(r=>{const o=S.tickets.filter(t=>t.roomId===r.id&&t.status!=='resolved').length,p=S.tickets.filter(t=>t.roomId===r.id&&t.status==='resolved').length,sd=r.pw.length>3?Math.sqrt(avg(r.pw.map(x=>(x-avg(r.pw))**2))):0;return{r,h:Math.round(clamp(100-o*30-p*6-Math.min(15,sd*10),5,100))}}).sort((a,b)=>a.h-b.h).slice(0,6);
  const sev={high:['bad','High'],medium:['occ','Medium'],low:['neutral','Low']};
  return `<div class="page-head"><div><h2>Maintenance</h2><p>AI anomaly detection raises tickets automatically. Staff can also report issues.</p></div><button class="btn primary" onclick="openReport()">${ico('plus')} Report issue</button></div>
  <div class="grid g-2"><div class="card"><h3>Open tickets (${open.length})</h3>${open.length?open.map(t=>`<div class="item"><div class="main"><b>Room ${t.roomId}: ${esc(t.title)}</b> ${chip(sev[t.severity][0],sev[t.severity][1])}
   <div class="small muted">${esc(t.source)} · ${ago(t.created)}</div><div class="small">${esc(t.detail)}</div>
   <select style="margin-top:8px;max-width:220px;min-height:38px" aria-label="Assign technician" onchange="assignTicket('${t.id}',this.value)"><option value="">Unassigned</option>${['Ramesh (Electrical)','Sunita (Plumbing)','Imran (HVAC)'].map(n=>`<option ${t.assignee===n?'selected':''}>${n}</option>`).join('')}</select></div>
   <button class="btn sm primary" onclick="resolveTicket('${t.id}')">${ico('check',16)} Resolve</button></div>`).join(''):'<div class="empty">No open tickets. Use the Energy & IoT page to simulate a fault.</div>'}
   ${done.length?`<h3 style="margin-top:20px">Resolved</h3>${done.map(t=>`<div class="item small"><span>Room ${t.roomId}: ${esc(t.title)}</span><span class="muted">${ago(t.resolved)}</span></div>`).join('')}`:''}</div>
   <div class="card"><h3>Room health (predictive)</h3><p class="muted small" style="margin-bottom:12px">Lowest scores are most likely to need attention next.</p>
   ${health.map(x=>`<div style="margin-bottom:12px"><div class="row between small"><b>Room ${x.r.number}</b><span class="muted">${x.h}%</span></div><div class="bar ${x.h<70?'bad':''}"><i style="width:${x.h}%"></i></div></div>`).join('')}</div></div>`;
};

/* ---- AI insights ---- */
VIEWS.insights=()=>{
  const t=today(),days=[0,1,2,3,4,5,6].map(i=>{const d=addDays(t,i),f=forecast(d),m=priceMult(d);return{d,f,k:Math.round(occOn(d)*100),m}});
  const act=f=>f>=85?'High demand: hold last rooms for direct bookings':f>=70?'Healthy demand: keep standard rates':f>=45?'Moderate: promote upgrades':'Low demand: run an offer, schedule deep cleaning and repairs';
  const avgF=Math.round(avg(days.map(x=>x.f)));
  return `<div class="page-head"><div><h2>AI insights</h2><p>Forecasts, pricing ideas and a summary of what each AI module is doing.</p></div></div>
  <div class="grid g-3">
   <div class="card"><h3>Recommendation</h3><p class="muted small">Weighted scoring of every free room against guest preferences and history.</p><div class="kpi" style="padding:12px 0 0"><div class="v">${S.stats.recs}</div><div class="l">searches ranked</div></div></div>
   <div class="card"><h3>Prediction</h3><p class="muted small">Booked rooms plus weekday patterns from 28 days of history.</p><div class="kpi" style="padding:12px 0 0"><div class="v">${avgF}%</div><div class="l">expected occupancy, next 7 days</div></div></div>
   <div class="card"><h3>Anomaly detection</h3><p class="muted small">Z-score on power draw and a cooling check on temperature.</p><div class="kpi" style="padding:12px 0 0"><div class="v">${S.stats.anoms}</div><div class="l">faults detected</div></div></div>
   <div class="card"><h3>Chatbot (NLP)</h3><p class="muted small">Intent matching for guest questions and service requests.</p><div class="kpi" style="padding:12px 0 0"><div class="v">${S.stats.queries}</div><div class="l">questions answered</div></div></div>
   <div class="card"><h3>Optimization</h3><p class="muted small">Eco mode in empty rooms and floor-based cleaning routes.</p><div class="kpi" style="padding:12px 0 0"><div class="v">${S.stats.actions}</div><div class="l">automatic actions taken</div></div></div></div>
  <div class="grid g-2" style="margin-top:16px"><div class="card"><h3>Demand forecast</h3>${barChart(days.map(x=>({label:fday(x.d).split(' ')[0],value:x.k,value2:x.f})),{max:100,unit:'%',labels:true,label:'Forecast occupancy'})}
   <div class="legend"><span><b style="background:var(--brand)"></b>Already booked</span><span><b style="background:var(--lamp)"></b>AI forecast</span></div></div>
   <div class="card"><div class="row between"><h3 style="margin:0">Dynamic pricing</h3><label class="switch"><input type="checkbox" ${S.settings.dynamic?'checked':''} onchange="S.settings.dynamic=this.checked;save();toast('Dynamic pricing '+(this.checked?'on: new bookings use AI rates':'off'));render()"><span></span>Apply to new bookings</label></div>
   <div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>Date</th><th>Forecast</th><th>Rate</th><th>Suggested action</th></tr></thead><tbody>${days.map(x=>`<tr><td class="nowrap">${fday(x.d)}</td><td>${x.f}%</td><td>${chip(x.m>1?'bad':x.m<1?'ok':'neutral',(x.m>1?'+':x.m<1?'−':'')+Math.abs(Math.round((x.m-1)*100))+'%')}</td><td class="small">${act(x.f)}</td></tr>`).join('')}</tbody></table></div></div></div>`;
};

/* ---- AI assistant ---- */
let CH={msgs:[{who:'bot',text:"Hi, I'm Aria, your AI concierge. I can check availability, recommend a room, change your AC, or send a request to housekeeping.",chips:['Rooms available today','Recommend a room for a family','Extra towels please','Check-out time']}],pending:null};
VIEWS.chat=()=>`<div class="page-head"><div><h2>AI assistant</h2><p>Ask in plain English. ${sessionRoom()?'Using your Room '+sessionRoom().number+' for requests.':'Include your room number for requests, like "AC too hot in 304".'}</p></div></div>
  <div class="card chat"><div class="msgs" id="chatMsgs" aria-live="polite"></div><div class="chips" id="chatChips"></div>
  <form class="cform" onsubmit="sendChat(event)"><input id="chatIn" type="text" placeholder="Type your question" aria-label="Message" autocomplete="off"><button class="btn primary" type="submit" aria-label="Send">${ico('send')}</button></form></div>`;
function sessionRoom(){const b=UI.session&&booking(UI.session);return b&&b.status==='checked-in'?room(b.roomId):null}
function drawChat(){
  const el=$('#chatMsgs');if(!el)return;
  el.innerHTML=CH.msgs.map(m=>m.typing?`<div class="msg bot dots"><i></i><i></i><i></i></div>`:`<div class="msg ${m.who}">${esc(m.text).replace(/\n/g,'<br>')}${m.links?`<div class="row">${m.links.map(l=>`<button class="btn sm primary" onclick="${l[1]}">${l[0]}</button>`).join('')}</div>`:''}</div>`).join('');
  el.scrollTop=el.scrollHeight;const last=[...CH.msgs].reverse().find(m=>m.who==='bot'&&!m.typing);
  $('#chatChips').innerHTML=(last&&last.chips||[]).map(c=>`<button onclick="chatSay('${c.replace(/'/g,"\\'")}')">${esc(c)}</button>`).join('');
}
function chatSay(t){CH.msgs.push({who:'me',text:t});sendBot(t)}
function sendChat(e){e.preventDefault();const i=$('#chatIn'),t=i.value.trim();if(!t)return;i.value='';chatSay(t)}
function sendBot(t){
  CH.msgs.push({typing:true,who:'bot'});drawChat();
  setTimeout(()=>{CH.msgs=CH.msgs.filter(m=>!m.typing);const r=botReply(t);CH.msgs.push(Object.assign({who:'bot'},r));save();if(UI.view==='chat')drawChat()},550);
}
const INTENTS=[['greet',/^(hi|hello|hey|namaste|good (morning|evening|afternoon))\b/],['thanks',/\b(thanks|thank you|thx)\b/],
 ['issue',/(not working|broken|leak|problem|issue|noise|smell|stuck|dirty)/],['temp',/\b(ac|a\/c|air ?con\w*|temperature|too (hot|cold|warm)|cooler|warmer)\b/],
 ['lights',/\blights?\b/],['late',/(late check|extend|extra night)/],['service',/(towel|pillow|blanket|toiletr|clean|housekeeping|laundry|room service|water bottle|soap)/],
 ['recommend',/(recommend|suggest|best room|which room|family|couple|budget|cheap|suite|quiet|view)/],['avail',/(available|availability|vacant|free room|rooms left|any room)/],
 ['price',/(price|rate|cost|tariff|charges?|how much)/],['book',/\b(book|reserve|reservation)\b/],['times',/(check ?-?in|check ?-?out|timing)/],
 ['wifi',/(wi-?fi|internet|password)/],['food',/(breakfast|lunch|dinner|restaurant|food|menu|cafe)/],['amen',/(pool|gym|spa|parking|amenit)/],['cancel',/cancel/],['help',/(help|what can you do)/]];
const ROOMRE=/\b([1-4]0[1-6])\b/;
function botReply(raw){
  const t=raw.toLowerCase().trim();S.stats.queries++;
  if(CH.pending){const p=CH.pending;
    if(/^(cancel|never ?mind|no|stop)\b/.test(t)){CH.pending=null;return{text:'No problem, cancelled.'}}
    const m=t.match(ROOMRE);if(m){CH.pending=null;return runIntent(p.intent,p.t,+m[1])}}
  let intent='fallback';for(const [k,re] of INTENTS)if(re.test(t)){intent=k;break}
  return runIntent(intent,t,null);
}
function runIntent(intent,t,rn){
  const need=['issue','temp','lights','late','service'];
  if(need.includes(intent)){
    const m=t.match(ROOMRE),sr=sessionRoom();const num=rn||(m&&+m[1])||(sr&&sr.number);
    if(!num){CH.pending={intent,t};return{text:'Sure. Which room number are you in? (for example 304)'}}
    const r=room(num);if(!r)return{text:'I could not find room '+num+'. Room numbers run from 101 to 406.'};
    if(r.status!=='occupied')return{text:'Room '+num+' does not have an active check-in, so I cannot change it or send requests for it.'};
    return roomIntent(intent,t,r);
  }
  switch(intent){
   case'greet':return{text:'Hello! How can I help with your stay today?',chips:['Rooms available today','Room prices','Wi-Fi password','Breakfast timings']};
   case'thanks':return{text:'You are welcome! Anything else I can do?'};
   case'avail':{const d=today(),c=Object.keys(TYPES).map(k=>k+': '+S.rooms.filter(r=>r.type===k&&r.status==='available'&&isFree(r,d,addDays(d,1))).length);
     return{text:'Rooms available tonight:\n'+c.join('\n'),links:[['Book a room',"go('book')"]],chips:['Room prices','Recommend a quiet room']}}
   case'price':return{text:'Nightly rates before 12% GST:\n'+Object.keys(TYPES).map(k=>k+': '+inr(TYPES[k].price)).join('\n')+(S.settings.dynamic?'\nRates may change with demand.':''),chips:['Rooms available today','Recommend a room for a family']};
   case'recommend':{
     const p={guests:/family|kids|children/.test(t)?4:/couple|two/.test(t)?2:1,type:/family/.test(t)?'Family':/suite|luxury/.test(t)?'Suite':/cheap|budget|cheapest/.test(t)?'Standard':'Any',view:'Any',floor:/high|top/.test(t)?'High':'Any',quiet:/quiet|peace/.test(t),budget:0};
     ['City','Garden','Pool','Hill'].forEach(v=>{if(t.includes(v.toLowerCase()))p.view=v});S.stats.recs++;
     const res=recommend(p,today(),addDays(today(),1)).slice(0,3);
     if(!res.length)return{text:'I could not find a free room for that tonight. Try another date on the booking page.',links:[['Open booking',"go('book')"]]};
     return{text:'Top picks for tonight:\n'+res.map(x=>'Room '+x.r.number+' · '+x.r.type+', '+x.r.view+' view · '+inr(priceFor(x.r,today()))+' · '+x.match+'% match').join('\n'),links:[['Book now',`PREFILL={type:'${p.type}'};go('book')`]]}}
   case'book':return{text:'I can help you book. Use the booking page and I will rank the best rooms for you.',links:[['Open booking',"go('book')"]]};
   case'times':return{text:'Check-in is from 2:00 PM and check-out is by 11:00 AM. Late check-out can be arranged for a fee, subject to availability.'};
   case'wifi':return{text:'Connect to "SmartStay-Guest". The password is welcome2026. Wi-Fi is free for all guests.'};
   case'food':return{text:'Breakfast is served 7:00–10:30 AM and the all-day café is open 11:00 AM–11:00 PM. Say "room service" and I will send an order request.',chips:['Room service']};
   case'amen':return{text:'Pool: 6 AM–9 PM. Gym: 24 hours. Spa: 10 AM–8 PM, booking at the front desk. Parking is free for guests.'};
   case'cancel':return{text:'You can cancel free of charge from the My stay page before check-in.',links:[['Open My stay',"go('stay')"]]};
   case'help':return{text:'I can: check availability and rates, recommend a room, change AC or lights, request towels or cleaning, report a problem, and answer questions about timings, Wi-Fi and food.',chips:['Rooms available today','Extra towels please','AC too hot']};
   default:return{text:'I did not quite get that. I can help with availability, rates, room recommendations, AC and lights, housekeeping requests, or hotel information.',chips:['Rooms available today','Room prices','Recommend a room for a family','What can you do?']};
  }
}
function roomIntent(intent,t,r){
  if(intent==='temp'){
    const m=t.match(/\b(1[6-9]|2[0-9]|30)\b/);let set=null;
    if(m)set=clamp(+m[1],18,28);else if(/(hot|warm|cooler)/.test(t))set=clamp(r.ac.set-2,18,28);else if(/(cold|warmer)/.test(t))set=clamp(r.ac.set+2,18,28);
    if(set===null){CH.pending=null;return{text:'What temperature would you like? Tell me a number between 18 and 28, like "set AC to 23".',chips:['Set AC to 22','Set AC to 24','Set AC to 26']}}
    r.ac.set=set;r.ac.mode='cool';const b=booking(r.bookingId);if(b)b.pref.temp=set;note('info','Aria set Room '+r.number+' AC to '+set+'°C for the guest');save();
    return{text:'Done. Room '+r.number+' AC is set to '+set+'°C. It will reach it in a few minutes.'}}
  if(intent==='lights'){const on=!/\boff\b/.test(t);r.lights=on;save();return{text:'Lights in Room '+r.number+' are now '+(on?'on':'off')+'.'}}
  if(intent==='late'){addTask(r.id,'request','Late check-out request',null);note('warn','Room '+r.number+': late check-out requested');save();return{text:'I have asked the front desk about a late check-out for Room '+r.number+'. It is ₹500 per hour until 3 PM, subject to availability. They will confirm shortly.'}}
  if(intent==='issue'){S.tickets.unshift({id:'T'+S.tid++,roomId:r.id,title:raw2title(t),detail:'Reported through AI assistant',severity:'medium',source:'Guest request',status:'open',assignee:'',created:Date.now()});r.flag=true;note('warn','Room '+r.number+': '+raw2title(t));save();return{text:'I am sorry about that. I created a maintenance ticket for Room '+r.number+'. A technician will contact you soon.'}}
  const item=/towel/.test(t)?'Extra towels':/(pillow|blanket)/.test(t)?'Extra pillow or blanket':/laundry/.test(t)?'Laundry pick-up':/room service/.test(t)?'Room service':/water/.test(t)?'Water bottles':/(toiletr|soap)/.test(t)?'Toiletries':'Room cleaning';
  addTask(r.id,'request',item+' requested via AI assistant',null);note('warn','Room '+r.number+': guest requested "'+item+'"');save();
  return{text:'Done. I sent your request for "'+item+'" to housekeeping for Room '+r.number+'. Expected within 15 minutes.'};
}
const raw2title=t=>{const s=t.replace(ROOMRE,'').replace(/\s+/g,' ').trim();return (s.charAt(0).toUpperCase()+s.slice(1)).slice(0,70)||'Guest reported a problem'};

/* =====================  INIT  ===================== */
(function init(){
  UI=Object.assign(defaultUI(),lsGet(UKEY)||{});
  S=lsGet(KEY);if(!S||S.v!==1||!S.rooms||!S.rooms.length)seed();
  const h=(location.hash||'').replace('#','');if(h&&NAV[UI.role].some(n=>n[0]===h))UI.view=h;
  render();startSim();
  if(UI.view==='bookings')drawBookings();
})();
const _render=render;render=function(){_render();if(UI.view==='bookings')drawBookings();if(UI.view==='stay')drawStayLive()};
</script>
